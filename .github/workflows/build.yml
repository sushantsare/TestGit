name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log
        shell: bash
      - name: Publish result to apk-builds branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cp app/build/outputs/apk/debug/*.apk /tmp/out/app-debug.apk 2>/dev/null && echo SUCCESS > /tmp/out/STATUS || echo FAILED > /tmp/out/STATUS
          tail -c 60000 build.log > /tmp/out/build.log || true
          echo "${GITHUB_SHA}" > /tmp/out/SOURCE_SHA
          cd /tmp/out && git init -q -b apk-builds && git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "Build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk-builds
