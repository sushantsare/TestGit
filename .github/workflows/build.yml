name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Read build target
        id: target
        run: |
          APP_DIR=$(head -n1 .build-target | tr -d '[:space:]')
          echo "dir=$APP_DIR" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APP_DIR")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare output folder
        run: mkdir -p /tmp/out/screens && echo FAILED > /tmp/out/STATUS && echo "${GITHUB_SHA}" > /tmp/out/SOURCE_SHA

      - name: Build release APK
        working-directory: ${{ steps.target.outputs.dir }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee /tmp/out/build.log
          # Apps with per-CPU APKs: deliver the 64-bit phone APK, keep all variants in apks/
          main=$(ls app/build/outputs/apk/release/*arm64-v8a*.apk 2>/dev/null | head -1 || true)
          [ -z "$main" ] && main=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$main" "/tmp/out/${{ steps.target.outputs.name }}.apk"
          mkdir -p /tmp/out/apks && cp app/build/outputs/apk/release/*.apk /tmp/out/apks/
          echo BUILT > /tmp/out/STATUS

      - name: Unit tests
        id: unit
        continue-on-error: true
        working-directory: ${{ steps.target.outputs.dir }}
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee /tmp/out/unit-tests.log
          echo PASSED > /tmp/out/UNIT_TESTS

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator walkthrough test
        id: ui
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: ${{ steps.target.outputs.dir }}
          script: |
            adb shell settings put global hide_error_dialogs 1 || true
            adb shell settings put secure anr_show_background 0 || true
            ./gradlew :app:connectedDebugAndroidTest --stacktrace > /tmp/out/ui-tests.log 2>&1 && echo PASSED > /tmp/out/UI_TESTS || echo FAILED > /tmp/out/UI_TESTS
            adb pull /sdcard/Pictures/GymShots/. /tmp/out/screens/ || true
            adb pull /sdcard/Pictures/AppShots/. /tmp/out/screens/ || true
            if [ -f e2e.sh ]; then bash e2e.sh || true; fi
            adb logcat -d -t 3000 > /tmp/out/logcat.txt || true
            if [ ! -f e2e.sh ]; then adb logcat -d -s GrabbitE2E:I > /tmp/out/e2e-results.txt || true; fi

      - name: Real-world e2e on Android 14
        id: e2e34
        if: hashFiles(format('{0}/e2e.sh', steps.target.outputs.dir)) != ''
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: ${{ steps.target.outputs.dir }}
          script: bash e2e.sh 34 || true

      - name: Real-world e2e on Android 15
        id: e2e35
        if: hashFiles(format('{0}/e2e.sh', steps.target.outputs.dir)) != ''
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: ${{ steps.target.outputs.dir }}
          script: bash e2e.sh 35 || true

      - name: Collect reports
        if: always()
        working-directory: ${{ steps.target.outputs.dir }}
        run: |
          [ -f /tmp/out/UNIT_TESTS ] || echo FAILED > /tmp/out/UNIT_TESTS
          [ -f /tmp/out/UI_TESTS ] || echo NOT_RUN > /tmp/out/UI_TESTS
          mkdir -p /tmp/out/reports
          cp -r app/build/test-results /tmp/out/reports/unit 2>/dev/null || true
          cp -r app/build/outputs/androidTest-results /tmp/out/reports/ui 2>/dev/null || true
          cp -r app/build/outputs/roborazzi /tmp/out/reports/roborazzi 2>/dev/null || true
          find app/build -name '*.png' -path '*robolectric*' -exec cp {} /tmp/out/screens/ \; 2>/dev/null || true
          for f in build.log unit-tests.log ui-tests.log; do [ -f /tmp/out/$f ] && tail -c 80000 /tmp/out/$f > /tmp/out/$f.tmp && mv /tmp/out/$f.tmp /tmp/out/$f; done

      - name: Publish to apk-builds branch
        if: always()
        run: |
          cd /tmp/out
          git init -q -b apk-builds
          git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "Build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk-builds
