<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InkNote — clickable prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<style>
:root{
  --p:#2B5BD7;--onp:#fff;--pc:#DCE5FB;--onpc:#0F2A73;
  --bg:#FBF8F3;--card:#FFFFFF;--surf:#ECE8E1;--surf2:#F4F1EC;--div:#E4DED4;
  --txt:#1C1B1F;--mut:#625D55;--paper:#FFFFFF;--line:#DCE6F7;--ink:#1F3F9A;--ink2:#2B5BD7;--red:#C0392B;--hl:#FFE066;
  --scrim:rgba(20,18,14,.42);--sh:0 1px 3px rgba(60,50,30,.10);--sh2:0 6px 20px rgba(60,50,30,.18);
}
body.dark{
  --p:#9DB6FF;--onp:#0B1D4D;--pc:#243A73;--onpc:#DCE5FB;
  --bg:#141518;--card:#1E2024;--surf:#2A2C31;--surf2:#232529;--div:#34373D;
  --txt:#ECE8E1;--mut:#ABA59B;--paper:#1E2024;--line:#2D3A52;--ink:#A9C1FF;--ink2:#8FB0FF;--red:#FF8A80;--hl:#7A6A1E;
  --scrim:rgba(0,0,0,.6);--sh:0 1px 3px rgba(0,0,0,.4);--sh2:0 8px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Inter,Roboto,system-ui,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden;font-size:14px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.disp{font-family:"Inter Display",Inter,sans-serif}
#app{position:fixed;inset:0;display:flex}
.pane{position:relative;height:100%;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
.scroll{flex:1;overflow:auto;padding-bottom:110px}
.st{height:26px;flex:none;font-size:12px;display:flex;justify-content:space-between;padding:7px 20px 0;color:var(--mut)}
.top{display:flex;align-items:center;gap:6px;padding:4px 8px;height:60px;flex:none}
.tt{font-size:24px;font-weight:700;flex:1;padding-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none}
.ib:active,.ib.on{background:var(--surf)}
.chips{display:flex;gap:8px;padding:2px 16px 12px;overflow-x:auto;scrollbar-width:none;flex:none}
.chip{white-space:nowrap;padding:0 14px;height:34px;display:inline-flex;align-items:center;gap:6px;border-radius:12px;font-size:13.5px;background:var(--surf)}
.chip.on{background:var(--p);color:var(--onp)}
.g{display:grid;grid-template-columns:repeat(var(--cols,2),1fr);gap:12px;padding:2px 16px}
.card{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--sh);text-align:left;position:relative}
.card.sel{outline:2.5px solid var(--p)}
.th{height:140px;position:relative;margin:6px 6px 0;border-radius:11px;overflow:hidden;border:1px solid var(--div);background:var(--paper)}
.me{padding:8px 11px 11px;font-size:12px;color:var(--mut)}
.me b{display:block;font-size:14px;color:var(--txt);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.tag{color:var(--p)}
.fab{position:absolute;right:16px;bottom:22px;width:60px;height:60px;border-radius:18px;background:var(--p);display:grid;place-items:center;box-shadow:0 6px 16px rgba(43,91,215,.35);z-index:5}
.sbar{position:absolute;left:16px;right:92px;bottom:25px;height:56px;border-radius:16px;background:var(--card);display:flex;align-items:center;gap:10px;padding:0 16px;font-size:15px;color:var(--mut);box-shadow:var(--sh2);z-index:5;text-align:left}
.badge{position:absolute;right:7px;bottom:7px;font-size:10px;font-weight:700;background:#d93025;color:#fff;padding:2px 6px;border-radius:5px}
.rec{position:absolute;left:7px;bottom:7px;font-size:10.5px;font-weight:600;background:var(--p);color:var(--onp);padding:2px 8px;border-radius:9px}
.pinm{position:absolute;right:7px;top:7px;width:24px;height:24px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:var(--sh)}
.lk{position:absolute;inset:0;display:grid;place-items:center;background:var(--surf2)}
.sec{padding:16px 20px 6px;font-size:13px;font-weight:600;color:var(--p)}
.li{display:flex;align-items:center;gap:16px;padding:0 20px;min-height:56px;width:100%;text-align:left}
.li .t{flex:1;font-size:15.5px}.li .t small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
.li .c{color:var(--mut);font-size:13px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.sw{width:52px;height:32px;border-radius:16px;background:var(--surf);position:relative;flex:none;border:2px solid var(--mut)}
.sw::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:var(--mut);left:6px;top:6px;transition:.2s}
.sw.on{background:var(--p);border-color:var(--p)}.sw.on::after{left:24px;background:var(--onp);width:22px;height:22px;top:3px}
.btn{height:44px;padding:0 22px;border-radius:12px;background:var(--p);color:var(--onp);font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn.t{background:transparent;color:var(--p)}.btn.o{background:transparent;color:var(--p);border:1.5px solid var(--p)}.btn.s{background:var(--pc);color:var(--onpc)}
/* editor */
.recbar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--div);border-radius:14px;padding:7px 12px;margin:0 12px 8px;flex:none}
.recbar .pl{width:34px;height:34px;border-radius:50%;background:var(--p);display:grid;place-items:center}
.prog{flex:1;height:4px;background:var(--surf);border-radius:2px;position:relative}.prog i{position:absolute;left:0;top:0;height:4px;width:38%;background:var(--p);border-radius:2px}
.canvas{flex:1;overflow:auto;padding:4px 12px 190px}
.page{container-type:inline-size;background:var(--paper);border-radius:6px;box-shadow:var(--sh);position:relative;margin:0 auto 14px;overflow:hidden}
.page.port{width:100%;max-width:820px;aspect-ratio:210/297}
.page.land{width:100%;max-width:1100px;aspect-ratio:297/210}
.pnum{position:absolute;right:10px;bottom:8px;font-size:11px;color:var(--mut)}
.tools{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--div);padding:8px 8px 14px;z-index:6}
.trow{display:flex;justify-content:space-around;max-width:620px;margin:0 auto}
.tb{width:46px;height:46px;border-radius:13px;display:grid;place-items:center}
.tb.on{background:color-mix(in srgb,var(--p) 16%,transparent)}
.crow{display:flex;gap:12px;align-items:center;padding:2px 10px 10px;max-width:620px;margin:0 auto}
.cc{width:26px;height:26px;border-radius:50%;flex:none}
.cc{box-shadow:inset 0 0 0 1px rgba(127,127,127,.45)}.cc.on{outline:2.5px solid var(--p);outline-offset:2.5px}
.size{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:12px;color:var(--mut)}
.size i{display:block;width:80px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--p) 40%,var(--surf) 40%)}
.fmt{display:flex;gap:4px;align-items:center;padding:0 6px 8px;overflow-x:auto;max-width:620px;margin:0 auto}
.fmt .tb{width:42px;height:40px;font-weight:700;font-size:16px}
/* sheets & dialogs */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:20;animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:24px 24px 0 0;z-index:21;max-height:88%;overflow:auto;padding:8px 0 22px;animation:up .25s ease-out}
.sheet .h{width:36px;height:4px;border-radius:2px;background:var(--div);margin:6px auto 12px}
.sheet h3{font-size:19px;font-weight:700;padding:0 20px 4px}
.sheet p.sub{color:var(--mut);font-size:13px;padding:0 20px 10px}
.dlg{position:absolute;left:24px;right:24px;top:50%;transform:translateY(-50%);background:var(--card);border-radius:28px;z-index:21;padding:24px;animation:fade .2s}
.menu{position:absolute;right:10px;top:70px;background:var(--card);border-radius:14px;box-shadow:var(--sh2);z-index:21;min-width:240px;padding:6px 0;animation:fade .15s}
.menu .li{min-height:48px;font-size:15px;gap:14px;padding:0 16px}
.drawer{position:absolute;left:0;top:0;bottom:0;width:300px;max-width:85%;background:var(--card);z-index:21;border-radius:0 24px 24px 0;overflow:auto;animation:slide .25s ease-out;padding-bottom:20px}
.navp{width:280px;flex:none;border-right:1px solid var(--div);background:var(--card);overflow:auto;height:100%}
.nv{display:flex;align-items:center;gap:14px;height:52px;margin:0 12px;padding:0 14px;border-radius:26px;width:calc(100% - 24px);text-align:left;font-size:15px}
.nv.on{background:var(--pc);color:var(--onpc);font-weight:600}
.nv .c{margin-left:auto;font-size:13px;color:var(--mut)}
.tpl{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:4px 20px 12px}
.tpl button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px}
.tpl .pv{width:100%;aspect-ratio:3/4;border-radius:8px;border:1px solid var(--div);background:var(--paper);overflow:hidden;position:relative}
.tpl button.on .pv{outline:2.5px solid var(--p);outline-offset:1px}
.seg{display:flex;margin:4px 20px 12px;border:1px solid var(--mut);border-radius:20px;overflow:hidden}
.seg button{flex:1;height:44px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:500}
.seg button+button{border-left:1px solid var(--mut)}
.seg button.on{background:var(--pc);color:var(--onpc)}
.pinpad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center;margin-top:18px}
.pinpad button{width:72px;height:72px;border-radius:50%;background:var(--surf);font-size:26px;font-weight:500}
.toast{position:absolute;left:16px;right:16px;bottom:100px;background:#2F3033;color:#F2EFEA;border-radius:10px;padding:14px 16px;z-index:30;display:flex;gap:10px;align-items:center;font-size:14px;animation:fade .2s}
.toast b{margin-left:auto;color:#A9C1FF}
.lasso-act{position:absolute;display:flex;gap:2px;background:var(--card);border-radius:14px;box-shadow:var(--sh2);padding:4px;z-index:7}
.lasso-act button{display:flex;flex-direction:column;align-items:center;font-size:10.5px;gap:2px;padding:6px 9px;border-radius:10px;color:var(--txt)}
.hlm{background:color-mix(in srgb,var(--hl) 80%,transparent);border-radius:3px;padding:0 2px}
.res{background:var(--card);border-radius:16px;box-shadow:var(--sh);margin:0 16px 10px;padding:12px;display:flex;gap:12px;text-align:left;width:calc(100% - 32px)}
.res .th{height:76px;width:62px;margin:0;flex:none}
.res .k{font-size:11px;font-weight:600;color:var(--p);display:flex;align-items:center;gap:4px;margin-top:4px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 32px 120px}
.empty h2{font-size:22px;margin:18px 0 8px}.empty p{color:var(--mut);line-height:1.5;margin-bottom:22px}
.proto{position:fixed;left:50%;top:6px;transform:translateX(-50%);z-index:99;display:flex;gap:6px;background:rgba(30,30,30,.82);color:#fff;border-radius:20px;padding:4px 6px;font-size:12px;backdrop-filter:blur(6px)}
.proto button{color:#fff;padding:5px 10px;border-radius:14px}.proto button.on{background:rgba(255,255,255,.22)}
body.shot .proto{display:none}
@keyframes up{from{transform:translateY(40%);opacity:.4}}@keyframes fade{from{opacity:0}}@keyframes slide{from{transform:translateX(-60%)}}
.split{display:flex;flex:1;min-height:0}.split>.pane{flex:1;border-left:1px solid var(--div)}
.mw{max-width:1040px;margin:0 auto;width:100%}
.pg{display:grid;grid-template-columns:repeat(var(--pc2,2),1fr);gap:14px;padding:6px 16px}
.pgc{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;color:var(--mut)}
.pgc .page{width:100%;margin:0}
.pgc.on .page{outline:2.5px solid var(--p);outline-offset:2px}
</style>
</head>

  <div class="sec">Tags</div><div style="display:flex;flex-wrap:wrap;gap:8px;padding:4px 20px 10px">${TAGS.map((t,i)=>`<button class="chip ${i==0?'on':''}">#${t}</button>`).join('')}<button class="chip" style="border:1.5px dashed var(--mut);background:none">${ic('plus',16)}New tag</button></div>
  <div style="display:flex;justify-content:flex-end;padding:6px 20px 0"><button class="btn" onclick="go({overlay:null,select:false});toast('Saved')">Done</button></div></div>`}
 if(o==='newfolder'){h=`<div class="dlg"><h3 class="disp" style="font-size:22px;margin-bottom:16px">New folder</h3><div style="border:1.5px solid var(--p);border-radius:8px;padding:14px;font-size:16px">Grammar practice<span style="display:inline-block;width:2px;height:18px;background:var(--p);vertical-align:middle;margin-left:1px"></span></div>
  <div style="display:flex;gap:12px;margin:18px 0">${['#2B5BD7','#0E8A6B','#B4561F','#8A3FB8','#C0392B','#F9A825'].map((c,i)=>`<span class="cc ${i==4?'on':''}" style="background:${c}"></span>`).join('')}</div>
  <div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn t" ${close}>Cancel</button><button class="btn" onclick="go({overlay:null});toast('Folder created')">Create</button></div></div>`}
 if(o==='emptytrash'){h=`<div class="dlg"><h3 class="disp" style="font-size:22px">Empty Trash?</h3><p style="color:var(--mut);margin:12px 0 20px;line-height:1.5">3 notes will be deleted for good. This can't be undone.</p><div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn t" ${close}>Cancel</button><button class="btn" style="background:#B3261E;color:#fff" onclick="go({overlay:null});toast('Trash emptied')">Delete all</button></div></div>`}
 if(o==='backup'){h=`<div class="sheet"><div class="h"></div><h3 class="disp">Back up all notes</h3><p class="sub">Creates one file with every note, PDF, image and recording. Save it to Google Drive, a pen drive or anywhere you like.</p>
  <div style="margin:6px 20px 14px;padding:14px;border-radius:14px;background:var(--surf2);display:flex;gap:12px;align-items:center">${ic('backup',28,'var(--p)')}<div><b>InkNote-backup-20-Nov-2026.inkbackup</b><div style="color:var(--mut);font-size:13px;margin-top:2px">42 notes · about 214 MB</div></div></div>
  <div style="display:flex;justify-content:flex-end;gap:8px;padding:0 20px"><button class="btn t" ${close}>Cancel</button><button class="btn" onclick="go({overlay:null});toast('Backup saved')">Choose where to save</button></div></div>`}
 if(o==='image'){h=`<div class="sheet" role="dialog" aria-label="Insert"><div class="h"></div><h3 class="disp">Insert</h3><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 16px 6px">${[['image','Image','From gallery'],['camera','Camera','Take a photo'],['scan','Scan','Paper document'],['mic','Voice recording','Synced to writing'],['audio','Audio file','Song or clip'],['pdf','PDF','Add its pages']].map(([i,l,s])=>`<button style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px;border-radius:16px;background:var(--surf2);font-size:13px;font-weight:600" onclick="${i==='mic'?"go({overlay:null,recording:true})":`go({overlay:null});toast('${l}')`}"><span style="width:46px;height:46px;border-radius:14px;background:var(--pc);display:grid;place-items:center">${ic(i,24,'var(--onpc)')}</span>${l}<small style="font-weight:400;color:var(--mut);font-size:11px">${s}</small></button>`).join('')}</div></div>`}
 return `<div class="scrim" ${close}></div>${h}`}
/* ================= render ================= */
function render(){const a=document.getElementById('app');let main;
 const scr={home,editor,pdf,search,trash,settings,about,pages:pagesScr}[S.screen]||home;
 if(isTab()){
   if(S.screen==='editor'||S.screen==='pdf'){ main=`<div class="navp" style="width:340px;position:relative">${listMini()}</div>${scr()}`}
   else main=`<div class="navp">${navList()}</div>${scr()}`;
 } else main=scr();
 a.innerHTML=main+(S.drawer&&!isTab()?`<div class="scrim" onclick="go({drawer:false})"></div><div class="drawer">${navList()}</div>`:'')+overlay()+(S.toast?`<div class="toast">${S.toast}</div>`:'');
 document.getElementById('pTheme').textContent=document.body.classList.contains('dark')?'Light':'Dark';}
function listMini(){return `<div class="top"><span class="tt disp" style="font-size:20px">All notes</span><button class="ib" aria-label="Search" onclick="go({screen:'search'})">${ic('search')}</button></div>
 ${vis().map(n=>`<button class="li" style="padding:8px 16px;${n.id===S.note?'background:var(--pc);':''}" onclick="openNote(${n.id})"><div style="width:48px;height:58px;flex:none;position:relative">${thumb(n,'height:58px;margin:0')}</div><span class="t" style="min-width:0;font-size:14.5px"><span style="font-weight:600">${n.t}</span><small>${n.d}</small></span></button>`).join('')}`}
document.getElementById('pTheme').onclick=()=>{document.body.classList.toggle('dark');render()};
document.getElementById('pStates').onclick=()=>{S.empty=!S.empty;S.screen='home';render()};
document.getElementById('pReset').onclick=()=>location.href=location.pathname;
addEventListener('resize',render);
if(Q.get('rec'))S.recording=true;
if(Q.get('split'))S.split=true,S.note2=+Q.get('split');
if(Q.get('overlay')==='lock')S.lockId=6;
render();
</script>
</body>
</html>
