*{box-sizing:border-box;margin:0;padding:0}
.scr{width:412px;height:915px;overflow:hidden;background:#FBF6EE;font-family:Manrope,sans-serif;color:#1E1B16;font-feature-settings:"tnum";position:relative}
.ms{font-family:MS;font-size:24px;line-height:1;display:inline-block;font-weight:400;font-variation-settings:'FILL' 0}
.f1{font-variation-settings:'FILL' 1}
.sb{height:28px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-size:12px;font-weight:600}
.top{display:flex;align-items:center;padding:8px 8px 4px 18px} .top .tt{flex:1;font-size:22px;font-weight:800;letter-spacing:-.3px}
.ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#6A6155}
.cardx{background:#FFFDF8;border:1px solid #E6DACA;border-radius:16px}
.sec{display:flex;justify-content:space-between;align-items:baseline;padding:18px 18px 8px;font-size:15px;font-weight:800} .sec span{font-size:13px;color:#2C3E8C;font-weight:700}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px}
.av{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center} .av .ms{font-size:21px}
.rt{flex:1;min-width:0} .t1{font-size:14px;font-weight:700} .t2{font-size:12px;color:#6A6155;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:800;font-size:14px} .inc{color:#1F7A45} .exp{color:#B3261E}
.fab{position:absolute;right:18px;bottom:96px;width:60px;height:60px;border-radius:18px;background:#E68A1E;color:#1E1B16;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.18)} .fab .ms{font-size:30px}
.nav{position:absolute;bottom:0;left:0;right:0;height:80px;background:#FFFDF8;border-top:1px solid #E6DACA;display:flex;justify-content:space-around;align-items:center;padding-bottom:6px}
.ni{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:#6A6155;width:70px}
.ni .pill{width:56px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.ni.on{color:#1E1B16} .ni.on .pill{background:#FCE3C2;color:#5A3300}
.chip{white-space:nowrap;border:1px solid #E6DACA;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;background:#FFFDF8;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:#FCE3C2;border-color:#FCE3C2;color:#5A3300}
.chip .ms{font-size:18px}
.btn{background:#2C3E8C;color:#fff;border-radius:999px;height:52px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.label{position:absolute;left:0;right:0;top:0;height:0}

  setTimeout(()=>{ if(push) stack.push(k); el.innerHTML = themed(SCREENS[resolve(k)]); el.scrollTop=0; wire(el); el.classList.remove('fade'); layout(); },90); }
function back(){ if(stack.length>1){ stack.pop(); show(stack[stack.length-1], false);} }
function snack(t){ $('#snackT').textContent=t; $('#snack').style.display='flex'; clearTimeout(window._s); window._s=setTimeout(()=>$('#snack').style.display='none',3500); }
function on(el, sel, fn, textMatch){ el.querySelectorAll(sel).forEach(n=>{ if(textMatch && !n.textContent.includes(textMatch)) return; n.classList.add('tap'); n.onclick=e=>{e.stopPropagation(); fn(n);} }); }
function wire(el){
  const cur = stack[stack.length-1];
  on(el,'.ni',n=>{ const t=n.textContent.trim().replace(/^[a-z_]+/,''); stack=[tabs[t]]; show(tabs[t],false); });
  on(el,'.fab',n=>{ if(cur==='12-udhar') snack('Add person — opens the person form'); else show('02-add-amount'); });
  on(el,'[data-go]',n=>show(n.dataset.go));
  el.querySelectorAll('.ib').forEach(n=>{ const i=n.textContent.trim(); n.classList.add('tap');
    n.onclick=()=>{ if(i==='arrow_back'||i==='close') back(); else if(i==='settings') show('18-settings'); else if(i==='search') show('08-search');
      else if(i==='calendar_month') show('06-calendar'); else if(i==='view_list') show('05-entries'); else if(i==='visibility'){ el.querySelectorAll('.amt,[style*="font-size:34px"],[style*="font-size:30px"]').forEach(a=>a.style.filter=a.style.filter?'':'blur(7px)'); }
      else if(i==='delete'){ back(); snack('Entry deleted'); } else snack('Demo: '+i.replace(/_/g,' ')); }; });
  on(el,'.btn',n=>{ const t=n.textContent.trim();
    if(t==='Next' && cur==='02-add-amount') show('03-add-category');
    else if(t==='Next' && cur==='17-setup') { stack=['01-home']; show('01-home',false); snack('Setup done'); }
    else if(t.startsWith('Save')) { stack=['01-home']; show('01-home',false); snack('Expense saved · ₹386'); }
    else if(t==='Pay card bill') show('11-pay-bill');
    else if(t.startsWith('Pay ₹')) { back(); snack('Card bill paid — not counted as spending'); }
    else if(t==='Set up accounts') show('17-setup');
    else if(t==='Add an entry') show('02-add-amount');
    else if(t==='Allow SMS access') { show('16-sms-inbox'); snack('SMS access allowed'); }
    else if(t==='You gave'||t==='You got') snack(t+' — enter amount');
    else snack(t); });
  if(cur==='03-add-category') on(el,'.cardx',()=>show('04-add-details'));
  if(cur==='04-add-details') on(el,'.cardx[style*="padding:12px;display:flex"]',n=>{ el.querySelectorAll('.cardx[style*="padding:12px;display:flex"]').forEach(c=>{c.style.background='';c.style.borderColor='';}); n.style.background=dark?'#5A3A12':'#FCE3C2'; n.style.borderColor='#E68A1E'; });
  if(['01-home','05-entries','06-calendar','08-search'].includes(cur)) on(el,'.row',()=>openDetail('07-entry-detail'));
  if(cur==='01-home'){ on(el,'div',()=>show('16-sms-inbox'),'SMS entries need'); on(el,'.cardx',()=>show('10-card-detail'),'HDFC Millennia'); on(el,'.sec span',n=>show(n.textContent.includes('cards')?'09-accounts':'05-entries')); }
  if(cur==='09-accounts') on(el,'.row',n=>{ if(n.textContent.includes('Millennia')) openDetail('10-card-detail'); else snack('Account detail — same layout as card'); });
  if(cur==='12-udhar') on(el,'.row',()=>openDetail('13-person'));
  if(cur==='13-person') on(el,'.chip',n=>snack(n.textContent.includes('WhatsApp')?'Opens WhatsApp with a polite reminder for ₹2,193':'Marked as settled'));
  if(cur==='16-sms-inbox') on(el,'.chip',n=>{ const t=n.textContent; if(t.includes('OK')){ n.closest('.cardx').style.display='none'; snack('Saved from SMS'); } else if(t==='Ignore'){ n.closest('.cardx').style.display='none'; snack('Ignored'); } else if(t.includes('Missed')) snack('Shows recent money SMS that were ignored'); else if(t==='Edit') show('04-add-details'); });
  if(cur==='sms-look') on(el,'.chip',n=>{ if(n.textContent.includes('teach')) { back(); snack('Learned — this UCO Bank format will parse automatically now'); } });
  if(cur==='14-reports') on(el,'.chip',n=>{ el.querySelectorAll('.chip').forEach(c=>c.classList.remove('on')); n.classList.add('on'); });
  if(cur==='18-settings') on(el,'.row',n=>{ const t=n.textContent; if(t.includes('Backup')) show('19-backup'); else if(t.includes('Theme')) toggleTheme(); else if(t.includes('Categories')||t.includes('Recurring')) snack('Opens '+t.trim().split('\n')[0]); });
  if(cur==='18-settings' || cur==='19-backup') el.querySelectorAll('div[style*="width:52px;height:32px"]').forEach(s=>{ s.classList.add('tap'); s.onclick=e=>{e.stopPropagation(); const k=s.firstElementChild, onS=s.style.background.includes('rgb(44')||s.style.background.includes('rgb(185'); s.style.background=onS?(dark?'#2C2720':'#F3EADB'):(dark?'#B9C4FF':'#2C3E8C'); k.style.left=onS?'6px':''; k.style.right=onS?'':'4px'; }; });
  if(cur==='20-lock') on(el,'div[style*="width:72px"]',()=>{stack=['01-home']; show('01-home',false);});
  if(cur==='e2-sms-permission') on(el,'div',()=>back(),'Not now');
  if(cur==='02-add-amount') on(el,'.chip',n=>{ if(n.textContent.includes('Pay card')) show('11-pay-bill'); else snack('Withdraw cash: bank → cash, not spending'); });
}
function openDetail(k){ window._det=k; if(document.body.classList.contains('wide')){ const d=$('#det'); d.innerHTML=themed(SCREENS[k]); d.querySelectorAll('.ib').forEach(n=>n.style.visibility=n.textContent.trim()==='arrow_back'?'hidden':''); $('#detail').classList.add('show'); } else show(k); }
function layout(){ const wide = innerWidth>=1000; document.body.classList.toggle('wide',wide);
  if(!wide) $('#detail').classList.remove('show');
  const s = Math.min(1, (innerHeight-70)/915, (wide? (innerWidth-140)/(412*2+16): (innerWidth-16)/412));
  ['#wrap','#detail'].forEach(q=>{ const e=$(q); e.style.transform=`scale(${s})`; e.style.transformOrigin='top center'; e.style.height=(915*s)+'px'; e.style.width=(412*s)+'px'; e.firstElementChild.style.transformOrigin='top left'; });
  $('#wrap').firstElementChild.style.transform=''; $('#wrap').style.transform=''; $('#scr').style.transform=`scale(${s})`; $('#scr').style.transformOrigin='top left';
  $('#detail').style.transform=''; $('#det').style.transform=`scale(${s})`; $('#det').style.transformOrigin='top left';
  const r=$('#rail'); r.innerHTML = themed(`<div style="width:96px;height:${915*s}px;background:#FFFDF8;border-radius:20px;display:flex;flex-direction:column;align-items:center;padding-top:20px;gap:18px">`+
    Object.keys(tabs).map(t=>`<div class="ni ${tabs[t]===stack[0]?'on':''}" data-t="${t}" style="cursor:pointer"><div class="pill"><span class="ms">${{Home:'home',Entries:'receipt_long',Accounts:'account_balance_wallet',Udhar:'handshake',Reports:'bar_chart'}[t]}</span></div>${t}</div>`).join('')+'</div>');
  r.querySelectorAll('[data-t]').forEach(n=>n.onclick=()=>{ stack=[tabs[n.dataset.t]]; show(stack[0],false); $('#detail').classList.remove('show'); }); }
function applyCss(){ document.getElementById('lt').media=dark?'not all':'all'; document.getElementById('dk').media=dark?'all':'not all'; }
function toggleTheme(){ dark=!dark; applyCss(); $('#bTheme').classList.toggle('on',dark); document.body.style.background=dark?'#0E0C09':'#E9E0D0'; show(stack[stack.length-1],false); if(window._det) openDetail(window._det); }
$('#bTheme').onclick=toggleTheme;
$('#bStates').onclick=()=>{ empty=!empty; $('#bStates').classList.toggle('on',empty); show(stack[stack.length-1],false); };
$('#bHome').onclick=()=>{ stack=['20-lock']; show('20-lock',false); };
addEventListener('resize',layout);
applyCss(); if(dark){ $('#bTheme').classList.add('on'); document.body.style.background='#0E0C09'; }
show('20-lock',false); stack=['20-lock'];
</script></body></html>
