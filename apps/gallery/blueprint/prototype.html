:root{
 --bg:#F4FBFA;--surf:#FFFFFF;--c1:#EEF5F4;--c2:#E8EFEE;--c3:#E2E9E8;--text:#161D1D;--sub:#3F4948;--pri:#00696B;--onpri:#FFFFFF;
 --pc:#B4EEEC;--opc:#002020;--out:#6F7979;--outv:#BEC9C8;--err:#BA1A1A;--onerr:#fff;--errc:#FFDAD6;--onerrc:#410002;
 --nav:#E8EFEE;--scrim:#0008;--inv:#2B3231;--oninv:#ECF2F1;--invpri:#80D4D4;--sun:#F5B841;
 --r-s:8px;--r-m:12px;--r-l:16px;--r-xl:28px;
}
html[data-theme=dark]{
 --bg:#0E1514;--surf:#161D1D;--c1:#1A2121;--c2:#242B2B;--c3:#2F3636;--text:#DDE4E3;--sub:#BEC9C8;--pri:#80D4D4;--onpri:#003738;
 --pc:#004F51;--opc:#9CF1F0;--out:#889392;--outv:#3F4948;--err:#FFB4AB;--onerr:#690005;--errc:#93000A;--onerrc:#FFDAD6;
 --nav:#1A2121;--scrim:#000a;--inv:#DDE4E3;--oninv:#2B3231;--invpri:#00696B;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#cfd8d7}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--text);display:flex;justify-content:center;align-items:center;overflow:hidden}
#dev{position:relative;width:412px;height:915px;max-height:100vh;background:var(--bg);overflow:hidden;box-shadow:0 10px 40px #0003}
body.full #dev{width:100vw;height:100vh;max-height:none;box-shadow:none}
@media (max-width:500px){#dev{width:100vw;height:100vh;max-height:none}}
.ic{width:24px;height:24px;fill:currentColor;flex:none;display:block}
.sb{height:32px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-size:12px;font-weight:600;flex:none}
.sb .ic{width:15px;height:15px;display:inline-block}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.body{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.tb{display:flex;align-items:center;gap:4px;padding:0 4px 0 4px;height:64px;flex:none;background:var(--bg);transition:background .2s}
.tb .t{flex:1;font-size:22px;font-weight:600;padding-left:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb .t small{display:block;font-size:12px;font-weight:500;color:var(--sub)}
.tb.sel{background:var(--pc);color:var(--opc)}
.btn-i{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:inherit;background:none;border:0}
.btn-i:active{background:color-mix(in srgb,currentColor 12%,transparent)}
.bar{height:80px;background:var(--nav);display:flex;justify-content:space-around;padding-top:12px;flex:none}
.ni{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--sub);width:110px;cursor:pointer}
.ind{width:64px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;transition:background .2s}
.ni.on{color:var(--text)} .ni.on .ind{background:var(--pc);color:var(--opc)}
.rail{width:88px;background:var(--bg);display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:44px;flex:none;border-right:1px solid var(--outv)}
.rail .ni{width:80px}
.dh{font-size:14px;font-weight:600;padding:16px 16px 8px;display:flex;justify-content:space-between;align-items:center}
.dh .ck{color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:2px}
.cell{aspect-ratio:1;background:var(--c2) center/cover;position:relative;cursor:pointer;overflow:hidden;transition:transform .15s}
.cell .vd{position:absolute;right:4px;bottom:4px;color:#fff;font-size:10.5px;font-weight:600;display:flex;align-items:center;background:#0008;border-radius:6px;padding:1px 6px 1px 1px}
.cell .vd .ic{width:14px;height:14px}
.cell .hf{position:absolute;left:5px;bottom:5px;color:#fff;filter:drop-shadow(0 1px 2px #0009)} .cell .hf .ic{width:16px;height:16px}
.cell .days{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 4px;background:linear-gradient(transparent,#0009);color:#fff;font-size:11px;font-weight:600}
.selm .cell{transform:scale(1)} .cell.picked{transform:scale(.86);border-radius:10px}
.cell .chk{position:absolute;left:6px;top:6px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:#0003}
.cell.picked .chk{background:var(--pri);border-color:var(--pri);display:flex;align-items:center;justify-content:center;color:var(--onpri)}
.cell.picked .chk .ic{width:16px;height:16px}
.fab-h{position:absolute;left:50%;transform:translateX(-50%);}
.pins{display:flex;justify-content:space-around;padding:4px 8px 4px}
.pn{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;cursor:pointer;width:84px;text-align:center}
.pc{width:58px;height:58px;border-radius:50%;background:var(--pc);color:var(--opc);display:flex;align-items:center;justify-content:center;position:relative}
.pc .bd{position:absolute;right:-2px;top:-2px;background:var(--err);color:var(--onerr);font-size:10px;font-weight:700;border-radius:9px;padding:1px 5px;min-width:18px}
.sh{font-size:14px;font-weight:700;padding:16px 16px 10px;display:flex;justify-content:space-between;align-items:center}
.sh span{font-weight:500;color:var(--sub);font-size:13px;display:flex;align-items:center;gap:4px;cursor:pointer}
.ag{display:grid;grid-template-columns:repeat(var(--acols,2),1fr);gap:14px 12px;padding:0 16px 24px}
.ac{cursor:pointer} .ac .cv{aspect-ratio:1;border-radius:16px;background:var(--c2) center/cover}
.ac .an{font-size:14px;font-weight:600;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .ac .ct{font-size:12px;color:var(--sub)}
.sheet-wrap{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-end;z-index:50;animation:fade .2s}
.sheet{color:var(--text);background:var(--c1);width:100%;border-radius:28px 28px 0 0;padding:8px 0 24px;max-height:85%;overflow:auto;animation:up .28s cubic-bezier(.05,.7,.1,1)}
.sheet .hd{width:32px;height:4px;border-radius:2px;background:var(--out);opacity:.5;margin:6px auto 14px}
.sheet h3{font-size:20px;font-weight:600;padding:0 24px 12px}
.row{display:flex;align-items:center;gap:16px;padding:12px 24px;min-height:56px;cursor:pointer;font-size:15px}
.row .ic{color:var(--sub)} .row .tx{flex:1} .row .tx small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.row.dg,.row.dg .ic{color:var(--err)}
.sw{width:52px;height:32px;border-radius:16px;background:var(--c3);border:2px solid var(--out);position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:var(--out);top:6px;left:6px;transition:.2s}
.sw.on{background:var(--pri);border-color:var(--pri)} .sw.on::after{width:24px;height:24px;top:2px;left:22px;background:var(--onpri)}
.snack{position:absolute;left:12px;right:12px;bottom:92px;background:var(--inv);color:var(--oninv);border-radius:6px;padding:4px 8px 4px 16px;display:flex;align-items:center;justify-content:space-between;font-size:14px;min-height:48px;z-index:60;animation:up .25s;box-shadow:0 3px 10px #0003}
.snack b{color:var(--invpri);font-weight:700;padding:10px 12px;cursor:pointer}
.btn{border:0;border-radius:999px;height:40px;padding:0 24px;font:600 14px 'Plus Jakarta Sans';cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn.f{background:var(--pri);color:var(--onpri)} .btn.t{background:none;color:var(--pri);padding:0 12px} .btn.o{background:none;border:1px solid var(--out);color:var(--pri)}
.btn.tn{background:var(--pc);color:var(--opc)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 32px;margin-top:18%}
.empty .il{width:180px;height:150px;margin-bottom:24px}
.empty h2{font-size:22px;font-weight:600} .empty p{font-size:14px;color:var(--sub);max-width:280px;margin-top:8px;line-height:1.45}
.empty .btn{margin-top:24px}
.menu{position:absolute;right:8px;top:72px;background:var(--c2);border-radius:4px;box-shadow:0 4px 16px #0003;z-index:55;min-width:200px;padding:8px 0;animation:fade .15s}
.menu div{padding:12px 16px;font-size:14px;cursor:pointer;display:flex;gap:12px;align-items:center} .menu .ic{color:var(--sub);width:22px;height:22px}
@keyframes up{from{transform:translateY(40px);opacity:0}} @keyframes fade{from{opacity:0}}
/* viewer */
.vw{background:#000;color:#fff}
.vw .stage{position:absolute;inset:0;overflow:hidden;touch-action:none}
.vw .track{position:absolute;inset:0;display:flex;will-change:transform}
.vw .pg{flex:none;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.vw .pg img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .2s;user-select:none;-webkit-user-drag:none}
.vw .top,.vw .bot{position:absolute;left:0;right:0;z-index:5;transition:opacity .2s,transform .2s}
.vw .top{top:0;background:linear-gradient(#000a,transparent);padding-bottom:20px}
.vw .bot{bottom:0;background:linear-gradient(transparent,#000a);display:flex;justify-content:space-around;padding:20px 8px 28px}
.vw.hide .top{opacity:0;transform:translateY(-20px)} .vw.hide .bot{opacity:0;transform:translateY(20px)}
.vw .tb{background:none} .vw .tb .t{font-size:16px} .vw .tb .t small{color:#fffc}
.hintchip{position:absolute;left:50%;transform:translateX(-50%);bottom:108px;background:#ffffff26;backdrop-filter:blur(8px);border:1px solid #ffffff40;color:#fff;border-radius:999px;padding:8px 14px;font-size:13px;display:flex;gap:6px;align-items:center;white-space:nowrap;z-index:6;cursor:pointer}
.hintchip .ic{width:18px;height:18px}
.playbig{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:50%;background:#0007;display:flex;align-items:center;justify-content:center;z-index:4;cursor:pointer}
.playbig .ic{width:40px;height:40px}
.seek{position:absolute;left:16px;right:16px;bottom:100px;display:flex;align-items:center;gap:10px;font-size:12px;z-index:5}
.seek .ln{flex:1;height:4px;border-radius:2px;background:#fff5;position:relative} .seek .ln i{position:absolute;left:0;top:0;bottom:0;width:30%;background:#fff;border-radius:2px}
.seek .ln i::after{content:"";position:absolute;right:-7px;top:-5px;width:14px;height:14px;border-radius:50%;background:#fff}
/* filmstrip */
.fs{background:#0D1414;color:#fff}
.fs .tb{background:none} .fs .tb .t{font-size:16px}
.fs .cnt{font-size:13px;opacity:.75;padding-right:16px}
.fs .stage{position:absolute;left:0;right:0;top:96px;bottom:150px;touch-action:none;overflow:hidden}
.fs .card{position:absolute;top:50%;border-radius:18px;background:#222 center/cover;box-shadow:0 10px 30px #000a;will-change:transform;transition:transform .32s cubic-bezier(.2,0,0,1),opacity .32s}
.fs .card.drag{transition:none}
.fs .card .vb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.fs .card .vb span{width:44px;height:44px;border-radius:50%;background:#0007;display:flex;align-items:center;justify-content:center}
.fs .trash{position:absolute;left:50%;top:8px;width:52px;height:52px;margin-left:-26px;border-radius:50%;background:#B3261E;display:flex;align-items:center;justify-content:center;color:#fff;transform:scale(0);transition:transform .15s;z-index:3}
.fs .hint{position:absolute;left:50%;transform:translateX(-50%);top:104px;background:#ffffff1f;border:1px solid #ffffff33;border-radius:999px;padding:7px 14px;font-size:13px;display:flex;gap:6px;align-items:center;white-space:nowrap;z-index:2;transition:opacity .3s}
.fs .hint .ic{width:18px;height:18px}
.fs .strip{position:absolute;left:0;right:0;bottom:44px;height:56px;display:flex;gap:4px;overflow-x:auto;padding:4px 50%;scrollbar-width:none;align-items:center}
.fs .strip::-webkit-scrollbar{display:none}
.fs .st{flex:none;width:32px;height:44px;border-radius:6px;background:#333 center/cover;opacity:.55;cursor:pointer;transition:.2s}
.fs .st.sel{opacity:1;outline:2px solid #B4EEEC;outline-offset:2px;width:36px;height:48px}
.fs .snack{bottom:116px}
/* pin */
.pin{display:flex;flex-direction:column;align-items:center;padding-top:40px}
.pin .lk{width:64px;height:64px;border-radius:50%;background:var(--pc);color:var(--opc);display:flex;align-items:center;justify-content:center}
.pin h2{font-size:22px;font-weight:600;margin-top:18px} .pin p{color:var(--sub);font-size:14px;margin-top:6px}
.dots{display:flex;gap:16px;margin:28px 0 30px} .dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--out)} .dots i.f{background:var(--pri);border-color:var(--pri)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 26px}
.key{width:76px;height:76px;border-radius:50%;background:var(--c2);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:600;cursor:pointer;user-select:none}
.key:active{background:var(--pc)} .key.n{background:none} .key.n .ic{width:30px;height:30px}
/* editor */
.ed{background:#000;color:#fff}
.ed .img{position:absolute;left:16px;right:16px;top:100px;bottom:250px;display:flex;align-items:center;justify-content:center}
.ed .img .wrap{position:relative;max-width:100%;max-height:100%}
.ed .img img{max-width:100%;max-height:calc(915px - 370px);display:block;transition:filter .2s,transform .3s}
.ed .crop{position:absolute;inset:0;border:2px solid #fff;box-shadow:0 0 0 999px #0007}
.ed .crop::before,.ed .crop::after{content:"";position:absolute;inset:33.3% 0;border-top:1px solid #fff8;border-bottom:1px solid #fff8}
.ed .crop i{position:absolute;inset:0 33.3%;border-left:1px solid #fff8;border-right:1px solid #fff8}
.ed .tools{position:absolute;left:0;right:0;bottom:0;background:#111;padding:14px 0 18px}
.ed .tabs{display:flex;justify-content:space-around;margin-top:14px}
.ed .tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:#aaa;cursor:pointer;width:80px}
.ed .tab.on{color:#fff} .ed .tab.on .ind{background:#004F51;color:#9CF1F0}
.ed .panel{height:110px;display:flex;align-items:center;justify-content:safe center;gap:10px;padding:0 16px;overflow-x:auto}
.chip{border:1px solid #fff5;border-radius:8px;padding:7px 14px;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:#004F51;border-color:#004F51;color:#9CF1F0}
.sl{width:100%;display:flex;flex-direction:column;gap:12px}
.sl label{display:flex;align-items:center;gap:12px;font-size:13px} .sl label span{width:84px} .sl input{flex:1;accent-color:#80D4D4}
.flt{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;cursor:pointer}
.flt div{width:58px;height:58px;border-radius:10px;background:center/cover} .flt.on div{outline:2px solid #80D4D4;outline-offset:2px}
/* settings */
.sg{font-size:13px;font-weight:700;color:var(--pri);padding:20px 24px 6px}
.seg{display:flex;border:1px solid var(--out);border-radius:999px;overflow:hidden;margin:4px 24px 8px}
.seg div{flex:1;text-align:center;padding:9px 0;font-size:13px;font-weight:600;cursor:pointer;border-right:1px solid var(--out)} .seg div:last-child{border:0}
.seg div.on{background:var(--pc);color:var(--opc)}
.card2{background:var(--surf);border:1px solid var(--outv);border-radius:16px;margin:8px 16px;padding:16px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 16px}
.stat div{background:var(--c1);border-radius:16px;padding:14px} .stat small{font-size:12px;color:var(--sub);font-weight:600} .stat b{display:block;font-size:26px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.banner{margin:4px 16px 8px;background:var(--c1);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--sub);display:flex;gap:10px;align-items:center}
.banner .ic{color:var(--pri);width:20px;height:20px}
.searchf{margin:8px 16px;height:56px;border-radius:28px;background:var(--c2);display:flex;align-items:center;gap:8px;padding:0 6px}
.searchf input{flex:1;border:0;background:none;font:16px 'Plus Jakarta Sans';color:var(--text);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 16px}
.chips .chip{border-color:var(--outv);color:var(--text)}
.lr{display:flex;align-items:center;gap:14px;padding:8px 16px;cursor:pointer}.lr .cv{width:56px;height:56px;border-radius:12px;background:center/cover;flex:none}
.lr b{font-size:15px;font-weight:600;display:block} .lr small{font-size:12px;color:var(--sub)}
mark{background:var(--pc);color:var(--opc);border-radius:3px}
/* tablet */
.split{display:flex;flex:1;min-height:0}
.split .lp{width:360px;border-right:1px solid var(--outv);overflow:auto;flex:none}
.split .rp{flex:1;overflow:auto}
.lp .lr.on{background:var(--pc);border-radius:16px;margin:0 8px;padding:8px}
.onb{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 28px 0}
.onb h1{font-size:28px;font-weight:700;margin-top:22px;line-height:1.2} .onb p{color:var(--sub);font-size:15px;margin-top:10px;line-height:1.5}
.why{background:var(--c1);border-radius:20px;padding:16px;margin-top:24px;text-align:left;display:flex;gap:12px;font-size:13.5px;line-height:1.45;color:var(--sub)}
.why .ic{color:var(--pri)} .why b{color:var(--text);display:block;margin-bottom:2px;font-size:14px}
#toolbar{position:fixed;top:8px;right:8px;display:flex;gap:6px;z-index:999}
#toolbar button{border:0;border-radius:999px;padding:8px 12px;font:600 12px 'Plus Jakarta Sans';background:#161D1D;color:#fff;cursor:pointer;opacity:.85}
body.render #toolbar{display:none}
</style></head>

function I(n,f){const p=ICONS[f?n+'-fill':n]||ICONS[n];return `<svg class="ic" viewBox="0 -960 960 960"><path d="${p}"/></svg>`}
let Q;try{Q=new URLSearchParams(location.search)}catch(e){Q=new URLSearchParams('')}
if(Q.get('theme')==='dark')document.documentElement.dataset.theme='dark';
if(Q.get('s'))document.body.classList.add('render');
if(Q.get('full'))document.body.classList.add('full');
const W=()=>document.getElementById('dev').clientWidth, H=()=>document.getElementById('dev').clientHeight;
const wide=()=>W()>=840;
// ---------- data ----------
const ALBUMS=['Camera','Screenshots','WhatsApp Images','Downloads','Instagram','Telegram','Edited','Wallpapers'];
const GROUPS=[['Today',7],['Yesterday',12],['Sat, 14 Nov',16],['Thu, 12 Nov',20],['Mon, 9 Nov',14],['October 2026',36],['September 2026',30]];
let items=[],id=0;
GROUPS.forEach(([g,n],gi)=>{for(let k=0;k<n;k++){const img=(id*7+gi*3)%PH.length;const alb=img%9==6?'Screenshots':ALBUMS[(id*5+gi)%ALBUMS.length];
 const vid=(id%9==2)?['0:24','1:05','0:12','3:41','0:48'][id%5]:null;
 items.push({id,img,g,alb:img%9==6?'Screenshots':alb,vid,fav:id%11==0,name:(img%9==6?'Screenshot_2026':'IMG_2026')+String(1120-gi*3).padStart(4,'0')+'_'+String(900+id*7).slice(-4)+(vid?'.mp4':'.jpg'),size:(1.2+((id*37)%40)/10).toFixed(1)+' MB',res:img%9==6?'1080 × 2400':'4000 × 3000'});id++}});
let bin=[],hidden=[],stateMode=Q.get('st')||'';
if(stateMode!=='binempty'){for(let k=0;k<12;k++){const it={id:1000+k,img:(k*5+3)%PH.length,g:'Bin',alb:'Camera',name:'IMG_2026101'+k+'.jpg',size:'2.4 MB',res:'4000 × 3000'};bin.push({it,days:30-[1,1,3,4,6,9,12,15,19,22,26,29][k]})}}
if(stateMode!=='vaultempty'){for(let k=0;k<6;k++)hidden.push({id:2000+k,img:(k*4+1)%PH.length,g:'Hidden',alb:'Hidden',name:'IMG_hidden'+k+'.jpg',size:'3.1 MB',res:'4000 × 3000'})}
if(stateMode==='empty')items=[];
const S={screen:Q.get('s')||'onboarding',stack:[],sel:new Set(),tab:'photos',album:null,list:[],idx:0,bars:true,undo:[],edTab:'adjust',flt:0,pin:'',theme:'system',grid:4,share:true,menu:false};
function albumItems(a){if(a==='Favourites')return items.filter(x=>x.fav);if(a==='Videos')return items.filter(x=>x.vid);return items.filter(x=>x.alb===a)}
// ---------- helpers ----------
const sb=(dark)=>`<div class="sb" style="${dark?'color:#fff':''}"><span>9:41</span><span style="display:flex;gap:4px">${I('signal_cellular_alt',1)}${I('battery_full',1)}</span></div>`;
function go(s,o={}){S.stack.push({screen:S.screen,album:S.album,list:S.list,idx:S.idx,tab:S.tab});Object.assign(S,o);S.screen=s;S.menu=false;render()}
function back(){if(document.querySelector('.sheet-wrap')){closeSheet();return}if(S.menu){S.menu=false;render();return}if(S.sel.size){S.sel.clear();render();return}const p=S.stack.pop();if(p){Object.assign(S,p);render()}}
function nav(){const t=S.tab;const it=(k,ic,l)=>`<div class="ni ${t==k?'on':''}" onclick="S.stack=[];S.tab='${k}';S.screen='${k}';render()"><div class="ind">${I(ic,t==k)}</div>${l}</div>`;
 return wide()?`<div class="rail">${it('photos','photo_library','Photos')}${it('albums','photo_album','Albums')}<div style="flex:1"></div><div class="ni" onclick="go('settings')" style="margin-bottom:24px"><div class="ind">${I('settings')}</div>Settings</div></div>`
 :`<div class="bar">${it('photos','photo_library','Photos')}${it('albums','photo_album','Albums')}</div>`}
function shell(inner){return wide()?`<div class="scr" style="flex-direction:row">${nav()}<div style="flex:1;display:flex;flex-direction:column;min-width:0">${sb()}${inner}</div></div>`:`<div class="scr">${sb()}${inner}${nav()}</div>`}
function cell(x,o={}){const pk=S.sel.has(x.id);return `<div class="cell ${pk?'picked':''}" style="background-image:url(${PH[x.img]})" data-id="${x.id}" ${o.click?`onclick="${o.click}"`:''}>${x.vid?`<span class="vd">${I('play_arrow',1)}${x.vid}</span>`:''}${x.fav&&!o.nofav?`<span class="hf">${I('favorite',1)}</span>`:''}${o.days!=null?`<span class="days">${o.days} days</span>`:''}${S.sel.size?`<span class="chk">${pk?I('check'):''}</span>`:''}</div>`}
function groupedGrid(list,ctx){if(!list.length)return '';const cols=wide()?8:S.grid;let h='',g=null,buf=[];const flush=()=>{if(buf.length)h+=`<div class="dh">${g}${S.sel.size?`<span class="ck">${I('check_circle')}</span>`:''}</div><div class="grid" style="--cols:${cols}">${buf.join('')}</div>`;buf=[]};
 list.forEach((x,i)=>{if(x.g!==g){flush();g=x.g}buf.push(cell(x,{click:`tapCell(${x.id},'${ctx}')`}))});flush();return h}
function tapCell(i,ctx){if(S.sel.size){S.sel.has(i)?S.sel.delete(i):S.sel.add(i);render();return}const list=ctx==='photos'?items:ctx==='vault'?hidden:albumItems(S.album);openViewer(list,list.findIndex(x=>x.id===i))}
function openViewer(list,idx){go('viewer',{list,idx,bars:true})}
let lpT;document.addEventListener('pointerdown',e=>{const c=e.target.closest('.cell');if(!c||!c.dataset.id||['viewer','bin'].includes(S.screen))return;lpT=setTimeout(()=>{S.sel.add(+c.dataset.id);c.dataset.lp=1;render();navigator.vibrate&&navigator.vibrate(20)},450)});
document.addEventListener('pointerup',()=>clearTimeout(lpT));document.addEventListener('pointermove',e=>{if(Math.abs(e.movementY)>3)clearTimeout(lpT)});
function selBar(){return `<div class="tb sel"><button class="btn-i" onclick="S.sel.clear();render()">${I('close')}</button><div class="t" style="font-size:18px">${S.sel.size} selected</div><button class="btn-i" onclick="shareSheet(${S.sel.size})">${I('share')}</button><button class="btn-i" onclick="delSel()">${I('delete')}</button><button class="btn-i" onclick="selMenu()">${I('more_vert')}</button></div>`}
function delSel(){const ids=[...S.sel];const moved=items.filter(x=>ids.includes(x.id));items=items.filter(x=>!ids.includes(x.id));moved.forEach(it=>bin.unshift({it,days:30}));S.sel.clear();render();snack(`${moved.length} moved to Recycle Bin`,()=>{moved.forEach(it=>{bin=bin.filter(b=>b.it!==it)});items=items.concat(moved).sort((a,b)=>a.id-b.id);render()})}
function snack(msg,undo){document.querySelectorAll('.snack').forEach(s=>s.remove());const d=document.createElement('div');d.className='snack';d.innerHTML=`<span>${msg}</span>${undo?'<b>Undo</b>':''}`;if(undo)d.querySelector('b').onclick=()=>{undo();d.remove()};document.querySelector('.scr').appendChild(d);clearTimeout(d._t);d._t=setTimeout(()=>d.remove(),5000)}
function sheet(h){closeSheet();const w=document.createElement('div');w.className='sheet-wrap';w.innerHTML=`<div class="sheet"><div class="hd"></div>${h}</div>`;w.onclick=e=>{if(e.target===w)closeSheet()};document.querySelector('.scr').appendChild(w)}
function closeSheet(){document.querySelectorAll('.sheet-wrap').forEach(s=>s.remove())}
function selMenu(){sheet(`<h3>${S.sel.size} selected</h3>${[['drive_file_move','Move to album',"moveSheet('Move')"],['content_copy','Copy to album',"moveSheet('Copy')"],['favorite','Add to Favourites',"favSel()"],['visibility_off','Move to Hidden album',"hideSel()"]].map(r=>`<div class="row" onclick="${r[2]}">${I(r[0])}<span class="tx">${r[1]}</span></div>`).join('')}`)}
function favSel(){items.forEach(x=>{if(S.sel.has(x.id))x.fav=true});const n=S.sel.size;S.sel.clear();closeSheet();render();snack(`${n} added to Favourites`)}
function hideSel(){const ids=[...S.sel];const m=items.filter(x=>ids.includes(x.id));items=items.filter(x=>!ids.includes(x.id));hidden=hidden.concat(m);S.sel.clear();closeSheet();render();snack(`${m.length} moved to Hidden album`)}
function moveSheet(kind){sheet(`<h3>${kind} to album</h3><div class="row" onclick="closeSheet();snack('New album created')">${I('add')}<span class="tx">New album</span></div>${ALBUMS.map((a,i)=>`<div class="lr" onclick="closeSheet();S.sel.clear();render();snack('${kind==='Move'?'Moved':'Copied'} to ${a}')"><div class="cv" style="background-image:url(${PH[albumItems(a)[0]?.img??i]})"></div><div><b>${a}</b><small>${albumItems(a).length} items</small></div></div>`).join('')}`)}
function shareSheet(n){sheet(`<h3>Share ${n} ${n>1?'photos':'photo'}</h3><div class="row" onclick="S.share=!S.share;this.querySelector('.sw').classList.toggle('on')">${I('location_off')}<span class="tx">Remove location<small>Hides where the photo was taken. Your original stays unchanged.</small></span><span class="sw ${S.share?'on':''}"></span></div><div style="padding:16px 24px 0;display:flex;justify-content:flex-end"><button class="btn f" onclick="closeSheet();snack('Opening Android share menu…')">${I('share')}Share</button></div>`)}
function sortSheet(){sheet(`<h3>Sort photos by</h3>${['Date taken','Date modified','Name','Size'].map((s,i)=>`<div class="row" onclick="closeSheet();snack('Sorted by ${s.toLowerCase()}')">${I(i==0?'radio_button_checked':'radio_button_unchecked',i==0)}<span class="tx">${s}</span></div>`).join('')}<div class="seg" style="margin-top:12px"><div class="on">Newest first</div><div>Oldest first</div></div>`)}
function menu(list){return S.menu?`<div class="menu">${list.map(r=>`<div onclick="S.menu=false;${r[2]}">${I(r[0])}${r[1]}</div>`).join('')}</div>`:''}

 const top=`<div class="tb"><div class="t">Albums</div><button class="btn-i" onclick="go('search')">${I('search')}</button><button class="btn-i" onclick="S.menu=!S.menu;render()">${I('more_vert')}</button></div>`;
 const pinH=`<div class="pins">${pins.map(p=>`<div class="pn" onclick="${p[2]}"><div class="pc">${I(p[0],1)}${p[3]?`<span class="bd">${p[3]}</span>`:''}</div><span>${p[1]}</span></div>`).join('')}</div>`;
 if(wide()){const sel=S.album||'Camera';return shell(top+`<div class="split"><div class="lp">${pinH}<div class="sh">Albums · ${ALBUMS.length}</div>${ALBUMS.map(a=>{const l=albumItems(a);return `<div class="lr ${a===sel?'on':''}" onclick="S.album='${a}';render()"><div class="cv" style="background-image:url(${PH[l[0]?.img??0]})"></div><div><b>${a}</b><small>${l.length} items</small></div></div>`}).join('')}</div><div class="rp"><div class="dh" style="font-size:20px;padding-top:4px">${sel}<span class="ck" style="font-size:13px">${albumItems(sel).length} items</span></div>${groupedGrid(albumItems(sel).map(x=>x),'album')}</div></div>`+menu([['sort','Sort albums','sortSheet()'],['add','New album',"snack('New album created')"],['settings','Settings',"go('settings')"]]))}
 return shell(top+`<div class="body">${pinH}<div class="sh">Albums · ${ALBUMS.length}<span onclick="sortSheet()">${I('sort')}Name</span></div><div class="ag" style="--acols:${W()>=600?3:2}">${cards}</div></div>`+menu([['sort','Sort albums','sortSheet()'],['add','New album',"snack('New album created')"],['settings','Settings',"go('settings')"]]))};
R.album=()=>{const l=albumItems(S.album);return shell((S.sel.size?selBar():`<div class="tb"><button class="btn-i" onclick="back()">${I('arrow_back')}</button><div class="t" style="padding-left:4px">${S.album}<small>${l.length} items</small></div><button class="btn-i" onclick="S.menu=!S.menu;render()">${I('more_vert')}</button></div>`)+`<div class="body">${l.length?groupedGrid(l,'album'):`<div class="empty">${ILL_EMPTY}<h2>Nothing here yet</h2><p>${S.album==='Favourites'?'Tap the heart on any photo to add it here.':'This album is empty.'}</p></div>`}</div>`+menu([['sort','Sort','sortSheet()'],['check_box','Select','selectFirst()']]))};
R.search=()=>{const q=S.q||'';const ql=q.toLowerCase();const am=q?ALBUMS.filter(a=>a.toLowerCase().includes(ql)):[];const fm=q?items.filter(x=>x.name.toLowerCase().includes(ql)).slice(0,24):[];const hl=s=>q?s.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>'):s;
 return `<div class="scr">${sb()}<div class="searchf"><button class="btn-i" onclick="back()">${I('arrow_back')}</button><input id="sq" placeholder="Search albums and files" value="${q}" oninput="S.q=this.value;render();const e=document.getElementById('sq');e.focus();e.setSelectionRange(99,99)">${q?`<button class="btn-i" onclick="S.q='';render()">${I('close')}</button>`:''}</div><div class="body">
 ${!q?`<div class="sh">Recent</div><div class="chips">${['WhatsApp','Screenshot','IMG_2026','Telegram'].map(s=>`<span class="chip" onclick="S.q='${s}';render()">${s}</span>`).join('')}</div>`:''}
 ${am.length?`<div class="sh">Albums</div>${am.map(a=>`<div class="lr" onclick="go('album',{album:'${a}'})"><div class="cv" style="background-image:url(${PH[albumItems(a)[0]?.img??0]})"></div><div><b>${hl(a)}</b><small>${albumItems(a).length} items</small></div></div>`).join('')}`:''}
 ${fm.length?`<div class="sh">Files · ${fm.length}</div><div class="grid" style="--cols:4">${fm.map(x=>cell(x,{click:`openViewer(items,${items.indexOf(x)})`})).join('')}</div>`:''}
 ${q&&!am.length&&!fm.length?`<div class="empty" style="margin-top:12%"><h2>No results for “${q}”</h2><p>Check the spelling or try a shorter word.</p></div>`:''}</div></div>`};
// viewer
R.viewer=()=>{const x=S.list[S.idx];if(!x){back();return ''}const n=S.list.length;
 return `<div class="scr vw ${S.bars?'':'hide'}"><div class="stage" id="vstage"><div class="track" id="vtrack" style="transform:translateX(${-S.idx*100}%)">${S.list.map((y,i)=>Math.abs(i-S.idx)<=1?`<div class="pg" style="position:absolute;left:${i*100}%;width:100%"><img src="${PH[y.img]}" draggable="false" id="${i==S.idx?'vimg':''}"></div>`:'').join('')}</div></div>
 ${x.vid?`<div class="playbig">${I('play_arrow',1)}</div><div class="seek" style="${S.bars?'':'opacity:0'}"><span>0:08</span><div class="ln"><i></i></div><span>${x.vid}</span></div>`:''}
 <div class="top">${sb(1)}<div class="tb"><button class="btn-i" onclick="back()">${I('arrow_back')}</button><div class="t">${x.g==='Today'?'Today':x.g}<small>9:41 AM</small></div><button class="btn-i" onclick="x_fav()">${I('favorite',x.fav)}</button><button class="btn-i" onclick="S.menu=!S.menu;render()">${I('more_vert')}</button></div></div>
 ${S.vhint!==false&&!Q.get('nohint')?`<div class="hintchip" onclick="S.vhint=false;openFilm()">${I('pinch_zoom_in')}Pinch in for filmstrip · tap to try</div>`:''}
 <div class="bot"><button class="btn-i" onclick="shareSheet(1)">${I('share')}</button><button class="btn-i" onclick="go('editor',{edTab:'adjust'})">${I('edit')}</button><button class="btn-i" onclick="infoSheet()">${I('info')}</button><button class="btn-i" onclick="vDelete()">${I('delete')}</button></div>
 ${menu([['rotate_right','Rotate','rot()'],['wallpaper','Set as wallpaper',"snack('Opening wallpaper picker…')"],['drive_file_move','Move to album',"moveSheet('Move')"],['content_copy','Copy to album',"moveSheet('Copy')"],['visibility_off','Move to Hidden album',"vHide()"]])}</div>`};
function x_fav(){const x=S.list[S.idx];x.fav=!x.fav;render();snack(x.fav?'Added to Favourites':'Removed from Favourites')}
let rotD=0;function rot(){rotD+=90;document.getElementById('vimg').style.transform=`rotate(${rotD}deg)`;snack('Rotated')}
function vDelete(){const x=S.list[S.idx];const at=S.idx;removeItem(x);if(!S.list.length){back();return}S.idx=Math.min(at,S.list.length-1);render();snack('Moved to Recycle Bin',()=>{restoreItem(x,at);S.idx=at;render()})}
function vHide(){const x=S.list[S.idx];removeItem(x);hidden.push(x);S.idx=Math.min(S.idx,S.list.length-1);render();snack('Moved to Hidden album')}
function removeItem(x){items=items.filter(y=>y!==x);S.list=S.list.filter(y=>y!==x);bin.unshift({it:x,days:30})}
function restoreItem(x,at){bin=bin.filter(b=>b.it!==x);items.push(x);items.sort((a,b)=>a.id-b.id);S.list.splice(at,0,x)}
function infoSheet(){const x=S.list[S.idx];sheet(`<h3>Details</h3>${[['calendar_today',x.g+' · 9:41 AM',''],['image',x.name,x.res+' · '+x.size],['folder',x.alb,'/storage/emulated/0/DCIM/'+x.alb],['photo_camera','Pixel camera','f/1.9 · 1/120s · ISO 64 · 6.8 mm'],['location_on','25.19, 85.52','Nalanda, Bihar']].map(r=>`<div class="row">${I(r[0])}<span class="tx">${r[1]}${r[2]?`<small>${r[2]}</small>`:''}</span></div>`).join('')}`)}
function openFilm(){go('film',{fidx:S.idx})}
function bindViewer(){const st=document.getElementById('vstage');if(!st)return;let sx,sy,dx=0,moved=false,t0,pts=new Map(),d0=0;
 const tr=document.getElementById('vtrack');
 st.onpointerdown=e=>{pts.set(e.pointerId,e);st.setPointerCapture(e.pointerId);if(pts.size===2){const [a,b]=[...pts.values()];d0=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}else{sx=e.clientX;sy=e.clientY;dx=0;moved=false;t0=Date.now()}};
 st.onpointermove=e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,e);if(pts.size===2){const [a,b]=[...pts.values()];const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);const sc=Math.min(1,d/d0);document.getElementById('vimg').style.transform=`scale(${sc})`;if(sc<.72){pts.clear();openFilm()}return}
  dx=e.clientX-sx;if(Math.abs(dx)>8)moved=true;tr.style.transition='none';tr.style.transform=`translateX(calc(${-S.idx*100}% + ${dx}px))`};
 st.onpointerup=st.onpointercancel=e=>{const was=pts.size;pts.delete(e.pointerId);if(was>=2){const im=document.getElementById('vimg');if(im)im.style.transform='';return}
  tr.style.transition='transform .3s cubic-bezier(.2,0,0,1)';if(moved&&Math.abs(dx)>W()*.2){S.idx=Math.max(0,Math.min(S.list.length-1,S.idx+(dx<0?1:-1)))}if(!moved&&Date.now()-t0<300){S.bars=!S.bars;S.menu=false}render()};
 st.onwheel=e=>{if(e.ctrlKey&&e.deltaY>0){e.preventDefault();openFilm()}}}
// filmstrip
R.film=()=>{const L=S.list;const n=L.length;const i=S.fidx;
 return `<div class="scr fs">${sb(1)}<div class="tb"><button class="btn-i" onclick="S.idx=S.fidx;back()">${I('arrow_back')}</button><div class="t">${S.album||'Photos'}</div><span class="cnt">${n?i+1:0} / ${n}</span></div>
 <div class="hint" id="fhint" style="${S.fhint===false?'opacity:0':''}">${I('swipe_up')}Flick up to delete</div>
 <div class="stage" id="fstage"><div class="trash" id="ftrash">${I('delete',1)}</div>${L.map((x,k)=>Math.abs(k-i)<=3?`<div class="card" data-k="${k}" style="background-image:url(${PH[x.img]})">${x.vid?`<div class="vb"><span>${I('play_arrow',1)}</span></div>`:''}</div>`:'').join('')}</div>
 <div class="strip" id="fstrip">${L.map((x,k)=>`<div class="st ${k==i?'sel':''}" style="background-image:url(${PH[x.img]})" onclick="S.fidx=${k};render()"></div>`).join('')}</div></div>`};
function cardGeom(){const wd=wide();const h=Math.min(wd?H()*.5:290, H()-300);const w=h*0.586;return {w,h,gap:w+14}}
function layoutCards(off=0){const {w,h,gap}=cardGeom();document.querySelectorAll('.fs .card').forEach(c=>{const k=+c.dataset.k;const d=k-S.fidx;const x=W()/2-w/2+d*gap+off;const sc=d===0?1:.9;c.style.width=w+'px';c.style.height=h+'px';c.style.left='0px';c.style.marginTop=(-h/2)+'px';if(!c.classList.contains('drag'))c.style.transform=`translateX(${x}px) scale(${sc})`;c.style.opacity=Math.abs(d)>2?0:(d===0?1:.75)})}
function bindFilm(){const st=document.getElementById('fstage');if(!st)return;layoutCards();
 const strip=document.getElementById('fstrip');const sel=strip.querySelector('.sel');if(sel)strip.scrollLeft=sel.offsetLeft-strip.clientWidth/2+18;
 let sx,sy,ax=null,dx=0,dy=0,t0,card,pts=new Map(),d0=0;const {w,h}=cardGeom();
 st.onpointerdown=e=>{pts.set(e.pointerId,e);st.setPointerCapture(e.pointerId);if(pts.size===2){const [a,b]=[...pts.values()];d0=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);return}sx=e.clientX;sy=e.clientY;ax=null;dx=dy=0;t0=Date.now();card=st.querySelector(`.card[data-k="${S.fidx}"]`)};
 st.onpointermove=e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,e);if(pts.size===2){const [a,b]=[...pts.values()];if(Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)/d0>1.35){pts.clear();S.idx=S.fidx;back()}return}
  dx=e.clientX-sx;dy=e.clientY-sy;if(!ax&&Math.hypot(dx,dy)>10)ax=Math.abs(dx)>Math.abs(dy)?'x':'y';
  if(ax==='x'){document.querySelectorAll('.fs .card').forEach(c=>c.style.transition='none');layoutCards(dx)}
  if(ax==='y'&&card){const {gap}=cardGeom();const y=dy<0?dy:dy*.15;card.classList.add('drag');card.style.transform=`translateX(${W()/2-w/2}px) translateY(${y}px) rotate(${y*-.02}deg)`;const p=Math.min(1,-y/(h*.35));document.getElementById('ftrash').style.transform=`scale(${Math.max(0,p)})`;}};
 st.onpointerup=st.onpointercancel=e=>{const was=pts.size;pts.delete(e.pointerId);if(was>=2)return;const dt=Date.now()-t0;
  document.querySelectorAll('.fs .card').forEach(c=>c.style.transition='');
  if(ax==='x'){const {gap}=cardGeom();const steps=Math.round(-dx/gap)||(Math.abs(dx)/dt>.5?(dx<0?1:-1):0);S.fidx=Math.max(0,Math.min(S.list.length-1,S.fidx+steps));render();return}
  if(ax==='y'&&card){const v=-dy/dt;card.classList.remove('drag');if(-dy>h*.35||(v>.9&&dy<-30)){filmDelete(card);return}document.getElementById('ftrash').style.transform='scale(0)';layoutCards();return}
  if(!ax&&dt<300){const k=e.target.closest('.card');if(k){const kk=+k.dataset.k;if(kk===S.fidx){S.idx=S.fidx;back()}else{S.fidx=kk;render()}}}};
 st.onwheel=e=>{if(e.ctrlKey&&e.deltaY<0){e.preventDefault();S.idx=S.fidx;back()}else if(!e.ctrlKey&&Math.abs(e.deltaX)+Math.abs(e.deltaY)>30){e.preventDefault();S.fidx=Math.max(0,Math.min(S.list.length-1,S.fidx+((e.deltaX||e.deltaY)>0?1:-1)));render()}}}
function filmDelete(card){const {w}=cardGeom();card.style.transition='transform .28s cubic-bezier(.3,0,.8,.15),opacity .28s';card.style.transform=`translateX(${W()/2-w/2}px) translateY(${-H()}px) rotate(6deg)`;card.style.opacity=0;navigator.vibrate&&navigator.vibrate(15);
 const x=S.list[S.fidx],at=S.fidx;S.fhint=false;setTimeout(()=>{removeItem(x);S.fidx=Math.min(at,S.list.length-1);if(!S.list.length){back();return}render();
  S.undo.push({x,at});snack('Moved to Recycle Bin',()=>{const u=S.undo.pop();if(!u)return;restoreItem(u.x,u.at);S.fidx=u.at;render()})},260)}
// bin
R.bin=()=>`<div class="scr">${sb()}<div class="tb"><button class="btn-i" onclick="back()">${I('arrow_back')}</button><div class="t" style="padding-left:4px">Recycle Bin<small>${bin.length} items</small></div>${bin.length?`<button class="btn t" onclick="emptyBin()">Empty</button>`:''}</div><div class="body">
 ${bin.length?`<div class="banner">${I('info')}Items are deleted forever after 30 days.</div><div class="grid" style="--cols:${wide()?8:4}">${bin.map((b,k)=>cell(b.it,{click:`binItem(${k})`,days:b.days,nofav:1})).join('')}</div>`:`<div class="empty">${ILL_BIN}<h2>Recycle Bin is empty</h2><p>Photos you delete stay here for 30 days, so you can bring them back.</p></div>`}</div></div>`;
function binItem(k){const b=bin[k];sheet(`<div style="display:flex;gap:14px;padding:0 24px 12px;align-items:center"><div style="width:64px;height:64px;border-radius:12px;background:url(${PH[b.it.img]}) center/cover"></div><div><b style="font-size:16px">${b.it.name}</b><div style="font-size:13px;color:var(--sub)">Deleted forever in ${b.days} days</div></div></div><div class="row" onclick="restoreBin(${k})">${I('history')}<span class="tx">Restore</span></div><div class="row dg" onclick="forever(${k})">${I('delete_forever')}<span class="tx">Delete forever</span></div>`)}
function restoreBin(k){const b=bin.splice(k,1)[0];items.push(b.it);items.sort((a,c)=>a.id-c.id);closeSheet();render();snack('Restored to '+b.it.alb)}
function forever(k){sheet(`<h3>Delete forever?</h3><p style="padding:0 24px;color:var(--sub);font-size:14px">This photo will be removed from your phone. You can't undo this.</p><div style="display:flex;justify-content:flex-end;gap:8px;padding:20px 24px 0"><button class="btn t" onclick="closeSheet()">Cancel</button><button class="btn f" style="background:var(--err);color:var(--onerr)" onclick="bin.splice(${k},1);closeSheet();render();snack('Deleted forever')">Delete forever</button></div>`)}
function emptyBin(){sheet(`<h3>Empty Recycle Bin?</h3><p style="padding:0 24px;color:var(--sub);font-size:14px">${bin.length} items will be removed from your phone forever. You can't undo this.</p><div style="display:flex;justify-content:flex-end;gap:8px;padding:20px 24px 0"><button class="btn t" onclick="closeSheet()">Cancel</button><button class="btn f" style="background:var(--err);color:var(--onerr)" onclick="bin=[];closeSheet();render()">Delete ${bin.length} items</button></div>`)}
// lock & vault
R.lock=()=>`<div class="scr">${sb()}<div class="tb"><button class="btn-i" onclick="back()">${I('arrow_back')}</button></div><div class="pin"><div class="lk">${I('lock',1)}</div><h2>Hidden album</h2><p>Enter your PIN</p><div class="dots">${[0,1,2,3].map(k=>`<i class="${k<S.pin.length?'f':''}"></i>`).join('')}</div>
 <div class="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<div class="key" onclick="pinKey(${d})">${d}</div>`).join('')}<div class="key n" onclick="S.pin='';S.screen='vault';render()" style="color:var(--pri)">${I('fingerprint')}</div><div class="key" onclick="pinKey(0)">0</div><div class="key n" onclick="S.pin=S.pin.slice(0,-1);render()">${I('backspace')}</div></div></div></div>`;
function pinKey(d){S.pin+=d;if(S.pin.length>=4){S.pin='';S.screen='vault';}render()}
R.vault=()=>`<div class="scr">${sb()}<div class="tb"><button class="btn-i" onclick="back()">${I('arrow_back')}</button><div class="t" style="padding-left:4px">Hidden<small>${hidden.length} items · locked when you leave</small></div><button class="btn-i" onclick="back()">${I('lock')}</button></div><div class="body">
 ${hidden.length?`<div class="banner">${I('shield_lock')}These photos are encrypted and only visible here.</div><div class="grid" style="--cols:${wide()?8:4}">${hidden.map(x=>cell(x,{click:`openViewer(hidden,${hidden.indexOf(x)})`})).join('')}</div>`:`<div class="empty">${ILL_LOCK}<h2>No hidden photos</h2><p>Select photos, tap ⋮ and choose “Move to Hidden album”.</p></div>`}</div></div>`;
// editor
const FL=[['Original','none'],['Vivid','saturate(1.5) contrast(1.1)'],['Warm','sepia(.3) saturate(1.3)'],['Cool','hue-rotate(-12deg) saturate(1.1) brightness(1.05)'],['Mono','grayscale(1)'],['Fade','contrast(.85) brightness(1.1) saturate(.8)'],['Drama','contrast(1.35) brightness(.9)'],['Retro','sepia(.6) contrast(.9)']];
R.editor=()=>{const x=S.list[S.idx];const f=FL[S.flt][1];const t=S.edTab;const pan={
 crop:`${['Free','1:1','4:3','16:9'].map((c,k)=>`<span class="chip ${k==0?'on':''}">${c}</span>`).join('')}`,
 adjust:`<div class="sl">${['Brightness','Contrast','Saturation'].map(s=>`<label><span>${s}</span><input type="range" value="50"></label>`).join('')}</div>`,
 filters:FL.map((q,k)=>`<div class="flt ${k==S.flt?'on':''}" onclick="S.flt=${k};render()"><div style="background-image:url(${PH[x.img]});filter:${q[1]}"></div>${q[0]}</div>`).join(''),
 rotate:`<button class="btn tn" onclick="rotD-=90;document.getElementById('eimg').style.transform='rotate('+rotD+'deg)'">${I('rotate_left')}Left</button><button class="btn tn" onclick="rotD+=90;document.getElementById('eimg').style.transform='rotate('+rotD+'deg)'">${I('rotate_right')}Right</button><button class="btn tn" onclick="document.getElementById('eimg').style.transform+=' scaleX(-1)'">${I('flip')}Flip</button>`}[t];
 return `<div class="scr ed">${sb(1)}<div class="tb" style="background:none"><button class="btn-i" onclick="back()">${I('close')}</button><div class="t" style="font-size:18px">Edit</div><button class="btn t" style="color:#80D4D4" onclick="saveSheet()">Save</button></div>
 <div class="img"><div class="wrap"><img id="eimg" src="${PH[x.img]}" style="filter:${f}">${t==='crop'?'<div class="crop"><i></i></div>':''}</div></div>
 <div class="tools"><div class="panel">${pan}</div><div class="tabs">${[['crop','crop','Crop'],['adjust','tune','Adjust'],['filters','filter_vintage','Filters'],['rotate','rotate_right','Rotate']].map(q=>`<div class="tab ${t==q[0]?'on':''}" onclick="S.edTab='${q[0]}';render()"><div class="ind">${I(q[1],t==q[0])}</div>${q[2]}</div>`).join('')}</div></div></div>`};
function saveSheet(){sheet(`<h3>Save changes</h3><div class="row" onclick="closeSheet();back();snack('Saved as a copy in Edited')">${I('content_copy')}<span class="tx">Save as copy<small>Keeps your original photo</small></span></div><div class="row" onclick="closeSheet();back();snack('Photo updated')">${I('save')}<span class="tx">Overwrite original</span></div>`)}
// settings
R.settings=()=>{const th=document.documentElement.dataset.theme==='dark'?2:(S.theme==='light'?1:0);
 const sw=(k,on,ic,t,s)=>`<div class="row" onclick="this.querySelector('.sw').classList.toggle('on')">${I(ic)}<span class="tx">${t}${s?`<small>${s}</small>`:''}</span><span class="sw ${on?'on':''}"></span></div>`;
 return `<div class="scr">${sb()}<div class="tb"><button class="btn-i" onclick="back()">${I('arrow_back')}</button><div class="t" style="padding-left:4px">Settings</div></div><div class="body" style="${wide()?'max-width:720px;margin:0 auto;width:100%':''}">
 <div class="sg">Appearance</div><div class="row" style="cursor:default">${I('dark_mode')}<span class="tx">Theme</span></div><div class="seg">${['System','Light','Dark'].map((s,k)=>`<div class="${k==th?'on':''}" onclick="setTheme('${s.toLowerCase()}')">${s}</div>`).join('')}</div>
 ${sw(0,0,'palette','Use wallpaper colours','Match Gallery to your phone’s colours')}
 <div class="sg">Gallery</div><div class="row" onclick="S.grid=S.grid==4?3:S.grid==3?5:4;render()">${I('grid_view')}<span class="tx">Photos per row<small>${S.grid}</small></span></div>
 ${sw(0,0,'visibility','Show hidden files','Include folders that start with a dot')}${sw(0,1,'location_off','Remove location when sharing','You can still change it each time you share')}
 <div class="sg">Recycle Bin</div><div class="row" onclick="go('bin')">${I('delete')}<span class="tx">Recycle Bin<small>Items are kept for 30 days</small></span>${I('chevron_right')}</div>
 <div class="sg">Hidden album</div><div class="row" onclick="snack('Enter your current PIN')">${I('password')}<span class="tx">Change PIN</span></div>${sw(0,1,'fingerprint','Unlock with fingerprint','')}
 <div class="sg">About</div><div class="row" onclick="go('diag')">${I('bug_report')}<span class="tx">Diagnostics<small>Crash log and usage stats on this phone</small></span>${I('chevron_right')}</div><div class="row" onclick="go('about')">${I('info')}<span class="tx">About Gallery<small>Version 1.0.0</small></span>${I('chevron_right')}</div><div style="height:24px"></div></div></div>`};
function setTheme(t){S.theme=t;document.documentElement.dataset.theme=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'';render()}
R.diag=()=>`<div class="scr">${sb()}<div class="tb"><button class="btn-i" onclick="back()">${I('arrow_back')}</button><div class="t" style="padding-left:4px">Diagnostics</div></div><div class="body">
 <div class="banner">${I('shield_lock')}Saved only on this phone. Nothing is sent anywhere.</div>
 <div class="sg">Usage · last 30 days</div><div class="stat"><div><small>App opened</small><b>214</b></div><div><small>Flicked to bin</small><b>1,086</b></div><div><small>Restored</small><b>23</b></div><div><small>Photos edited</small><b>17</b></div></div>
 <div class="sg">Crash log</div><div class="card2" style="display:flex;gap:12px;align-items:center;color:var(--sub);font-size:14px">${I('check_circle',1)}<span>No crashes recorded</span></div>
 <div style="padding:16px"><button class="btn o" onclick="snack('Log saved to Downloads')">${I('download')}Export log file</button></div></div></div>`;
R.about=()=>`<div class="scr">${sb()}<div class="tb"><button class="btn-i" onclick="back()">${I('arrow_back')}</button><div class="t" style="padding-left:4px">About</div></div><div class="body"><div style="display:flex;flex-direction:column;align-items:center;padding:24px 24px 8px;text-align:center">
 <div style="width:96px;height:96px;border-radius:26px;overflow:hidden;box-shadow:0 6px 18px #0002">${LOGO}</div><h2 style="font-size:24px;margin-top:16px">Gallery</h2><div style="color:var(--sub);font-size:14px;margin-top:4px">Version 1.0.0</div></div>
 <div class="card2"><div style="font-size:12px;font-weight:700;color:var(--pri)">DEVELOPER</div><div style="font-size:16px;font-weight:600;margin-top:6px">Sushant Kumar</div><div style="font-size:14px;color:var(--sub);margin-top:2px">sushant.sare@gmail.com</div></div>
 <div class="row">${I('shield_lock')}<span class="tx">Your photos never leave this phone<small>No internet permission, no ads, no tracking</small></span></div><div class="row" onclick="snack('Open-source licences')">${I('description')}<span class="tx">Open-source licences</span>${I('chevron_right')}</div></div></div>`;
// ---------- render ----------
function render(){const a=document.getElementById('app');const f=R[S.screen];a.innerHTML=f?f():'';
 if(S.screen==='viewer')bindViewer();if(S.screen==='film')bindFilm();
 document.querySelectorAll('.menu').forEach(m=>{const cl=e=>{if(!m.contains(e.target)){S.menu=false;render();document.removeEventListener('pointerdown',cl,true)}};setTimeout(()=>document.addEventListener('pointerdown',cl,true))})}
function toggleTheme(){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'':'dark';render()}
let stI=0;function toggleStates(){const st=[['photos','Empty photos',()=>{S._it=S._it||items;items=[]}],['bin','Empty bin',()=>{S._b=S._b||bin;bin=[]}],['denied','Permission denied',()=>{}],['vault','Empty hidden',()=>{S._h=S._h||hidden;hidden=[]}],['photos','Back to normal',()=>{if(S._it)items=S._it;if(S._b)bin=S._b;if(S._h)hidden=S._h}]];const s=st[stI++%st.length];s[2]();S.stack=[];S.screen=s[0];if(['photos','albums'].includes(s[0]))S.tab=s[0];render();snack('State: '+s[1])}
window.addEventListener('keydown',e=>{if(e.key==='Escape')back();if(S.screen==='viewer'){if(e.key==='ArrowRight'&&S.idx<S.list.length-1){S.idx++;render()}if(e.key==='ArrowLeft'&&S.idx>0){S.idx--;render()}if(e.key==='Delete')vDelete()}
 if(S.screen==='film'){if(e.key==='ArrowRight'&&S.fidx<S.list.length-1){S.fidx++;render()}if(e.key==='ArrowLeft'&&S.fidx>0){S.fidx--;render()}if(e.key==='Delete'||e.key==='ArrowUp'){const c=document.querySelector(`.fs .card[data-k="${S.fidx}"]`);if(c)filmDelete(c)}if(e.key==='z'&&(e.ctrlKey||e.metaKey))document.querySelector('.snack b')?.click()}});
window.addEventListener('resize',render);
try{history.pushState(null,'');window.addEventListener('popstate',()=>{back();try{history.pushState(null,'')}catch(e){}})}catch(e){}
// render-mode presets
(function(){const s=Q.get('s');if(!s)return;S.stack=[{screen:'photos',tab:'photos'}];
 if(s==='albums')S.tab='albums';
 if(s==='album')S.album=Q.get('a')||'Camera';
 if(['viewer','film','editor'].includes(s)){S.list=Q.get('v')?items.filter(x=>x.vid):items;S.idx=+(Q.get('i')||0);S.fidx=S.idx;S.album=null}
 if(s==='editor')S.edTab=Q.get('tab')||'adjust',S.flt=+(Q.get('flt')||0);
 if(Q.get('st')==='select'){[0,2,3,9].forEach(k=>items[k]&&S.sel.add(items[k].id))}
 if(Q.get('nohint'))S.vhint=false;
 if(Q.get('fhint')==='0')S.fhint=false;
 if(s==='search')S.q=Q.get('q')||'';
 if(s==='lock')S.pin=Q.get('pin')||'';
 render();
 const sh=Q.get('sheet');if(sh){if(sh==='info')infoSheet();if(sh==='share')shareSheet(1);if(sh==='sort')sortSheet();if(sh==='move')moveSheet('Move');if(sh==='binitem')binItem(0);if(sh==='save')saveSheet();if(sh==='sel')selMenu()}
 if(Q.get('menu')){S.menu=true;render()}
 if(Q.get('snack'))snack(Q.get('snack'),()=>{});
 if(Q.get('flick')){const c=document.querySelector(`.fs .card[data-k="${S.fidx}"]`);const {w,h}=cardGeom();c.classList.add('drag');c.style.transform=`translateX(${W()/2-w/2}px) translateY(${-h*.32}px) rotate(1.5deg)`;document.getElementById('ftrash').style.transform='scale(.92)'}
})();
if(!Q.get('s'))render();
</script></body></html>
