<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saveo prototype</title><style>
:root{--bg:#FFFFFF;--bg2:#F4F7F5;--card:#FFFFFF;--ink:#17211B;--muted:#5B6B61;--line:#E2E8E4;--pri:#1B8A5A;--pri2:#2FA56F;--onpri:#fff;--mint:#E6F4EC;--mintink:#1B6E48;--chip:#EEF4F0;--chipink:#33443A;--err:#BA1A1A;--errbg:#FFEDEA;--sh:0 2px 10px rgba(0,0,0,.06)}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#DCE3DF;font-family:Roboto,system-ui,sans-serif}
body{display:flex;flex-direction:column}#tools{flex:none;display:flex;gap:6px;justify-content:center;padding:6px;background:#17211B}
#tools button{border:none;border-radius:999px;padding:6px 12px;font:600 12px Roboto,sans-serif;background:#2B3A32;color:#fff;cursor:pointer}
#app{flex:1;min-height:0;width:100%;max-width:1400px;margin:0 auto;background:var(--bg);color:var(--ink);position:relative;overflow:hidden;display:flex}
@media(min-width:500px){#app.phone{max-width:412px;max-height:915px;margin:16px auto;border-radius:28px;box-shadow:0 10px 40px rgba(0,0,0,.2)}}
.rail{width:88px;background:var(--bg2);display:none;flex-direction:column;align-items:center;padding-top:40px;gap:22px;flex:none}
.wide .rail{display:flex}.wide .tabs{display:none}
.pane{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.side{flex:1;position:relative;overflow:hidden;display:none}.wide .side{display:block}
.scroll{flex:1;overflow-y:auto;padding-bottom:110px}
.tb{padding:10px 16px 0;display:flex;align-items:center;justify-content:space-between;min-height:56px;gap:8px}
.ttl{font-size:24px;font-weight:700}

.icb:active{background:var(--chip)}
.ic{width:22px;height:22px;display:inline-block;flex:none}
.src{background:var(--mint);color:var(--mintink);font-size:12px;font-weight:600;padding:8px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tabs{display:flex;margin-top:6px;border-bottom:1px solid var(--line)}
.tab{flex:1;text-align:center;padding:12px;color:var(--muted);font-size:15px;position:relative;cursor:pointer}
.tab.on{color:var(--pri);font-weight:600}
.tab.on:after{content:"";position:absolute;left:32%;right:32%;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--pri)}
.cnt{font-size:11px;background:var(--mint);color:var(--mintink);padding:1px 7px;border-radius:9px;margin-left:5px;font-weight:600}
.chips{display:flex;gap:8px;padding:12px 16px 8px;align-items:center}
.chip{padding:8px 15px;border-radius:999px;font-size:13px;font-weight:500;background:var(--chip);color:var(--chipink);cursor:pointer;border:none}
.chip.on{background:linear-gradient(180deg,var(--pri2),var(--pri));color:var(--onpri);box-shadow:0 2px 8px rgba(27,138,90,.35)}

.sec a{color:var(--pri);cursor:pointer}

.tile{aspect-ratio:1;position:relative;overflow:hidden;border-radius:22px;box-shadow:var(--sh);cursor:pointer;user-select:none;transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile svg.a{width:100%;height:100%;display:block}
.q{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:13px;font-weight:700;color:#fff;font-family:Georgia,serif}
.vb{position:absolute;top:9px;left:9px;background:rgba(0,0,0,.45);color:#fff;font-size:11px;padding:3px 7px;border-radius:8px;font-weight:500}
.selmode .vb{left:42px}
.bb{position:absolute;top:9px;right:9px;background:#fff;color:#1B6E48;font-size:10px;font-weight:700;width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.sv{position:absolute;right:9px;bottom:9px;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#fff,#E3F2EA);box-shadow:0 3px 8px rgba(0,0,0,.28),inset 0 1px 0 #fff;border:none;cursor:pointer;transition:transform .2s}

.sel{position:absolute;left:9px;top:9px;width:26px;height:26px;border-radius:50%;border:2.5px solid #fff;background:rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center}
.sel.on{background:var(--pri)}
.tile.dim:after{content:"";position:absolute;inset:0;background:rgba(27,138,90,.25);border:3px solid var(--pri);border-radius:22px}

.list{margin:0 16px;background:var(--card);border-radius:22px;overflow:hidden;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);min-height:60px;cursor:pointer}
.row:last-child{border-bottom:none}
.row .t{flex:1}.row .t b{font-weight:500;font-size:15px;display:block}.row .t span{font-size:12.5px;color:var(--muted)}
.ri{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.sw{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:.2s}.sw:after{content:"";position:absolute;left:4px;top:4px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.sw.on{background:var(--pri)}.sw.on:after{left:22px}
.gh{padding:20px 22px 8px;font-size:13px;font-weight:700;color:var(--pri)}
.btn{display:flex;gap:8px;justify-content:center;align-items:center;padding:15px 22px;border-radius:999px;background:linear-gradient(180deg,var(--pri2),var(--pri));color:var(--onpri);font-weight:600;font-size:15px;box-shadow:0 4px 12px rgba(27,138,90,.3);cursor:pointer;border:none;font-family:inherit}
.btn.ton{background:var(--mint);color:var(--mintink);box-shadow:none}
.btn.txt{background:none;color:var(--pri);box-shadow:none}
.center{text-align:center}
.snack{position:absolute;left:16px;right:16px;bottom:24px;background:#2B332F;color:#fff;border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;font-size:14px;box-shadow:0 6px 16px rgba(0,0,0,.3);z-index:20;animation:up .25s}
.snack b{color:#7EE2AE;cursor:pointer}@keyframes up{from{transform:translateY(20px);opacity:0}}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:30}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:28px 28px 0 0;padding:10px 0 24px;z-index:31;animation:up .25s}
.handle{width:36px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 14px}
.opt{padding:14px 24px;display:flex;justify-content:space-between;cursor:pointer;font-size:15px}
.viewer{position:absolute;inset:0;z-index:15;background:#1a1a1a;overflow:hidden;color:#fff;animation:fade .2s}@keyframes fade{from{opacity:0}}
.vbg{position:absolute;inset:-40px;filter:blur(40px) saturate(1.2);opacity:.95}
.vcard{position:relative;margin:12px 24px 0;height:min(56vh,520px);border-radius:28px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.35);touch-action:pan-y}
.gl{background:rgba(255,255,255,.25);color:#fff}
.sbig{flex:1;display:flex;gap:8px;justify-content:center;align-items:center;padding:16px;border-radius:999px;background:#fff;color:#14804F;font-weight:700;font-size:16px;box-shadow:0 6px 16px rgba(0,0,0,.2);cursor:pointer;border:none;font-family:inherit}
.sbig.ok{background:linear-gradient(180deg,#3CCB89,#148654);color:#fff}
.side .viewer{position:absolute}
.ctl{position:absolute;left:12px;right:12px;bottom:12px;padding:12px 14px;border-radius:20px;background:rgba(0,0,0,.35);backdrop-filter:blur(14px)}
.full{position:absolute;inset:0;background:var(--bg);z-index:12;display:flex;flex-direction:column;animation:fade .2s}
</style></head><body>

function homeView(){
 const a=list(),uns=st.statuses.filter(s=>!s.saved).length,sel=st.sel!=null;
 let top=sel?`<div class="tb" style="background:var(--mint)"><div style="display:flex;gap:6px;align-items:center"><button class="icb" onclick="st.sel=null;render()" aria-label="Close">${I.close}</button><div style="font-size:20px;font-weight:600">${st.sel.size} selected</div></div><button class="icb" aria-label="Select all" onclick="list().forEach(s=>st.sel.add(s.id));render()">${I.all}</button></div>`:`<div class="tb"><div class="ttl">${wide()?(st.tab?'Saved':'Statuses'):'Saveo'}</div><div style="display:flex;gap:2px;align-items:center"><span class="src" onclick="st.sheet='source';render()">${st.source} ▾</span><button class="icb" aria-label="Open WhatsApp" onclick="snack('Opening WhatsApp…')&&0;render()">${I.wa}</button><button class="icb" aria-label="More" onclick="st.sheet='menu';render()">${I.more}</button></div></div>`;
 let tabs=`<div class="tabs"><div class="tab ${st.tab==0?'on':''}" onclick="st.tab=0;st.sel=null;render()">Statuses<span class="cnt">${st.statuses.length}</span></div><div class="tab ${st.tab==1?'on':''}" onclick="st.tab=1;st.sel=null;render()">Saved<span class="cnt">${st.savedOrder.length}</span></div></div>`;
 let chips=`<div class="chips">${['All','Photos','Videos'].map(f=>`<button class="chip ${st.filter==f?'on':''}" onclick="st.filter='${f}';render()">${f}</button>`).join('')}${st.tab==1?`<div style="flex:1"></div><button class="icb" style="background:var(--chip)" aria-label="Sort" onclick="st.sheet='sort';render()">${I.sort}</button><button class="icb" style="background:var(--chip)" aria-label="Pick dates" onclick="st.sheet='date';render()">${I.cal}</button>`:''}</div>`;
 let body;
 if(st.tab==0&&st.stateMode==1)body=`<div class="center" style="padding:60px 32px 0"><svg viewBox="0 0 200 160" width="190" style="display:block;margin:0 auto"><rect x="30" y="30" width="80" height="100" rx="18" fill="var(--mint)" transform="rotate(-10 70 80)"/><rect x="80" y="22" width="86" height="110" rx="20" fill="var(--card)" stroke="var(--line)" stroke-width="3"/><circle cx="123" cy="70" r="22" fill="none" stroke="var(--pri)" stroke-width="5" stroke-dasharray="20 9"/><path d="M118 61l14 9-14 9z" fill="var(--pri)"/></svg><div style="font-size:22px;font-weight:700;margin-top:26px">No statuses yet</div><div style="font-size:15px;color:var(--muted);margin-top:10px;line-height:1.5">Watch a few statuses in WhatsApp first. Videos need to be watched fully. They'll show up here.</div><button style="display:inline-flex;margin-top:28px" class="btn" onclick="snack('Opening WhatsApp…');render()">${I.wa} Open WhatsApp</button><button class="btn txt" style="margin:6px auto 0" onclick="st.stateMode=0;document.getElementById('stb').textContent='States: normal';render()">Refresh</button></div>`;
 else if(st.tab==0&&st.stateMode==2)body=`<div style="margin:18px 16px 0;padding:18px;border-radius:22px;background:var(--errbg)"><div style="display:flex;gap:12px"><span style="color:var(--err)">${I.warn}</span><div><div style="font-weight:700;font-size:16px">Saveo lost access to WhatsApp</div><div style="font-size:14px;color:var(--muted);margin-top:6px;line-height:1.45">This happens after WhatsApp is reinstalled or Android resets permissions. Your saved items are safe.</div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn" style="padding:11px 18px;font-size:14px" onclick="st.scr='folder';render()">Fix now</button></div></div></div></div>`;
 else if(!a.length)body=`<div class="center" style="padding:80px 32px;color:var(--muted)"><div style="font-size:20px;font-weight:700;color:var(--ink)">${st.tab?'Nothing saved yet':'No '+st.filter.toLowerCase()}</div><div style="margin-top:8px">${st.tab?'Tap ⬇ on any status to keep it here.':'Try another filter.'}</div></div>`;
 else body=`<div class="sec"><span>${st.tab?'Saved · '+a.length+(st.sortNew?' · newest first':' · oldest first'):'Today & earlier · '+a.length}</span>${st.tab==0&&!sel?`<a onclick="st.sel=new Set();render()">Select</a>`:''}</div><div class="grid ${sel?'selmode':''}" style="--cols:${wide()?3:2}">${a.map(tile).join('')}</div>`;
 let fab='';
 if(sel)fab=`<div style="position:absolute;left:16px;right:16px;bottom:20px;display:flex;justify-content:space-around;padding:10px;border-radius:24px;background:var(--card);box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:5">${(st.tab==0?[['save','Save '+st.sel.size,'bulkSave()'],['share','Share',"bulkMsg('Share sheet opens')"],['repost','Repost',"bulkMsg('WhatsApp opens with '+st.sel.size+' items')"]]:[['share','Share',"bulkMsg('Share sheet opens')"],['del','Delete','bulkDel()']]).map(([k,l,f],i)=>`<div class="center" style="font-size:12px;font-weight:600;color:${i==0?'var(--pri)':'var(--chipink)'};cursor:pointer" onclick="${f}"><div class="icb" style="margin:0 auto;${i==0?'background:var(--mint)':''}">${I[k]}</div>${l}</div>`).join('')}</div>`;
 else if(st.tab==0&&uns&&!st.stateMode)fab=`<button class="efab" onclick="bulkSaveAll()">${I.save} Save all · ${uns}</button>`;
 return `${top}${tabs}${chips}<div class="scroll">${body}</div>${fab}`}
function bulkSave(){let n=0;st.sel.forEach(id=>{const s=st.statuses[id];if(!s.saved){s.saved=true;st.savedOrder.unshift(id);n++}});st.sel=null;snack(n?`${n} saved to gallery`:'Already saved');render()}
function bulkSaveAll(){let n=0;st.statuses.forEach(s=>{if(!s.saved){s.saved=true;st.savedOrder.unshift(s.id);n++}});snack(`${n} saved to gallery`);render()}
function bulkMsg(t){st.sel=null;snack(t);render()}
function bulkDel(){const ids=[...st.sel];st.sel=null;delItems(ids)}
function delItems(ids){const prev=[...st.savedOrder];st.savedOrder=st.savedOrder.filter(i=>!ids.includes(i));ids.forEach(i=>{st.statuses[i].saved=false;st.bin.unshift({id:i,days:30})});snack(`${ids.length} moved to Recycle bin`,'Undo',()=>{st.savedOrder=prev;ids.forEach(i=>{st.statuses[i].saved=true});st.bin=st.bin.filter(b=>!ids.includes(b.id));st.snack=null;render()});render()}
function viewerView(){
 const v=st.viewer,s=st.statuses[v.id],idx=v.list.indexOf(v.id),inSaved=st.tab==1;
 const ctl=s.dur?`<div class="ctl" onclick="event.stopPropagation()"><div style="display:flex;align-items:center;gap:10px;font-size:12px"><span>0:${st.playing?'12':'12'}</span><div style="flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.35);position:relative"><div style="width:40%;height:100%;background:#7EE2AE;border-radius:2px"></div><i style="position:absolute;left:40%;top:-5px;width:14px;height:14px;border-radius:50%;background:#fff;margin-left:-7px"></i></div><span>${s.dur}</span></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><button class="icb" style="color:#fff" aria-label="Mute" onclick="st.muted=!st.muted;render()">${st.muted?I.mute:I.vol}</button><button class="icb" style="width:48px;height:48px;background:#fff;color:#14804F" aria-label="Play or pause" onclick="st.playing=!st.playing;render()">${st.playing?I.pause:I.play}</button><button class="icb" style="color:${st.loop?'#7EE2AE':'#fff'}" aria-label="Loop" onclick="st.loop=!st.loop;render()">${I.loop}</button><button style="font:600 13px Roboto;color:#fff;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.2);border:none;cursor:pointer" onclick="st.speed=st.speed==2?0.5:st.speed+0.5;render()">${st.speed}×</button></div></div>`:'';
 return `<div class="viewer"><div class="vbg" style="background:${s.bg}"></div><div style="position:absolute;inset:0;background:rgba(0,0,0,.08)"></div><div style="position:relative;height:100%;display:flex;flex-direction:column">
 <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px 4px"><button class="icb gl" aria-label="Back" onclick="st.viewer=null;render()">${I.back}</button><div class="center"><div style="font-weight:600">${s.time}</div><div style="font-size:12px;opacity:.85">${s.dur?'Video'+(s.art=='cake'?' with music':''):'Photo'} · ${idx+1} of ${v.list.length}</div></div><button class="icb gl" aria-label="More" onclick="snack('Details · ${s.src=='B'?'WhatsApp Business':'WhatsApp'}');render()">${I.more}</button></div>
 <div class="vcard" id="vcard" style="background:${s.bg}">${art(s.art)}${ctl}</div>
 <div style="display:flex;justify-content:center;gap:6px;margin-top:14px">${v.list.map(i=>`<i style="width:${i==v.id?18:6}px;height:6px;border-radius:3px;background:#fff;opacity:${i==v.id?1:.5};transition:.2s"></i>`).join('')}</div>
 <div style="margin:18px 24px 0;display:flex;gap:10px;align-items:center">${inSaved?`<button class="sbig" onclick="snack('Share sheet opens');render()">${I.share.replace('class="ic"','class="ic" style="color:#14804F"')} Share</button><button class="icb gl" style="width:54px;height:54px" aria-label="Repost" onclick="snack('WhatsApp opens, ready to post');render()">${I.repost}</button><button class="icb gl" style="width:54px;height:54px" aria-label="Delete" onclick="const id=st.viewer.id;st.viewer=null;delItems([id])">${I.del}</button>`:`<button class="sbig ${s.saved?'ok':''}" onclick="saveOne(${s.id})">${s.saved?I.ok+' Saved':I.save+' Save to gallery'}</button><button class="icb gl" style="width:54px;height:54px" aria-label="Share" onclick="snack('Share sheet opens');render()">${I.share}</button><button class="icb gl" style="width:54px;height:54px" aria-label="Repost" onclick="snack('WhatsApp opens, ready to post');render()">${I.repost}</button>`}</div>
 <div style="text-align:center;font-size:12px;opacity:.75;margin-top:14px">Swipe left / right · arrow keys</div></div></div>`}
function step(d){const v=st.viewer;if(!v)return;const i=v.list.indexOf(v.id)+d;if(i>=0&&i<v.list.length){v.id=v.list[i];render()}}
addEventListener('keydown',e=>{if(e.key=='ArrowRight')step(1);if(e.key=='ArrowLeft')step(-1);if(e.key=='Escape'){st.viewer=null;st.sheet=null;render()}});
let sx=null;addEventListener('pointerdown',e=>{if(e.target.closest('#vcard'))sx=e.clientX});addEventListener('pointerup',e=>{if(sx!=null){const d=e.clientX-sx;if(Math.abs(d)>50)step(d<0?1:-1);sx=null}});
const back=t=>`<div class="tb"><div style="display:flex;gap:6px;align-items:center"><button class="icb" aria-label="Back" onclick="${t}">${I.back}</button><div class="ttl" style="font-size:22px">`;
function r(k,c,a,b,e,f){return `<div class="row" onclick="${f||''}"><span class="ri" style="background:${c}">${I[k]}</span><div class="t"><b>${a}</b>${b?`<span>${b}</span>`:''}</div>${e=='chev'?`<span style="color:var(--muted)">${I.chev}</span>`:`<div class="sw ${e?'on':''}"></div>`}</div>`}
const tog=k=>`st.settings.${k}=!st.settings.${k};render()`;
const SCR={
onboard:()=>`<div class="scroll" style="padding:40px 28px 120px" ><div class="center"><div style="width:120px;height:120px;margin:20px auto 0;border-radius:30px;overflow:hidden;box-shadow:0 10px 28px rgba(27,138,90,.35)">${ICON}</div><div style="font-size:30px;font-weight:700;margin-top:32px">Keep the statuses<br>you love</div><div style="font-size:15px;color:var(--muted);margin-top:12px;line-height:1.5">Save photos and videos from WhatsApp statuses in one tap. They stay in your gallery forever.</div></div><div class="list" style="margin:30px 0 0">${[['grid','Watch, then save','View a status in WhatsApp, then tap ⬇ here'],['lock','Private by design','No ads, no internet, nothing leaves your phone'],['bag','Yours forever','Saved even after the status disappears']].map(([k,a,b])=>`<div class="row"><span class="ri" style="background:var(--mint);color:var(--pri)">${I[k]}</span><div class="t"><b>${a}</b><span>${b}</span></div></div>`).join('')}</div></div><div style="position:absolute;left:24px;right:24px;bottom:28px"><button class="btn" style="width:100%" onclick="st.scr='folder';render()">Get started</button></div>`,
folder:()=>`${back("st.scr=st.folder.wa?'home':'onboard';render()")}</div></div></div><div class="scroll"><div style="padding:6px 24px 0"><div style="font-size:28px;font-weight:700">Connect WhatsApp</div><div style="font-size:15px;color:var(--muted);margin-top:8px;line-height:1.5">Android keeps statuses in a protected folder. Allow it once and Saveo will find new statuses by itself.</div></div><div style="margin:22px 16px 0" class="list">${[['wa','WhatsApp','14 statuses'],['b','WhatsApp Business','3 statuses'],['d','Dual WhatsApp','Works only if your phone allows it']].map(([k,a,b])=>{const on=st.folder[k];return `<div class="row" onclick="${k=='d'?"snack('Opens folder picker — your phone may not allow it');render()":`st.folder.${k}=true;snack('Connected · ${a}');render()`}"><span class="ri" style="background:${on?'linear-gradient(180deg,#3CCB89,#148654)':'var(--chip)'};color:${on?'#fff':'var(--muted)'}">${on?I.ok:I.folder}</span><div class="t"><b>${a}</b><span>${on?'Connected · '+b:k=='d'?b:'Not connected'}</span></div>${on?'<span style="color:var(--pri);font-weight:600;font-size:14px">Done</span>':`<span class="chip" style="background:var(--mint);color:var(--mintink);font-weight:600">${k=='d'?'Add folder':'Connect'}</span>`}</div>`}).join('')}</div><div style="margin:18px 16px 0;padding:14px 16px;border-radius:18px;background:var(--bg2);font-size:13px;color:var(--muted);line-height:1.5">Tap <b>Connect</b>, then on the next screen tap <b>USE THIS FOLDER</b> → <b>ALLOW</b>.</div></div><div style="position:absolute;left:24px;right:24px;bottom:28px"><button class="btn" style="width:100%;${st.folder.wa?'':'opacity:.45'}" onclick="if(st.folder.wa){st.scr='home';st.stateMode=0;document.getElementById('stb').textContent='States: normal';render()}else{snack('Connect WhatsApp first');render()}">Continue</button></div>`,
settings:()=>`${back("st.scr='home';render()")}Settings</div></div></div><div class="scroll"><div class="gh">Saving</div><div class="list">${r('auto','#1B8A5A','Auto-save new statuses','Saves every new status by itself',st.settings.auto,tog('auto'))}${r('bell','#E0912B','New status alerts','Checks every 15 minutes',st.settings.alerts,tog('alerts'))}${r('folder','#3D7BD9','WhatsApp folders',(st.folder.wa?'WhatsApp connected':'Not connected')+(st.folder.b?' · Business connected':''),'chev',"st.scr='folder';render()")}</div><div class="gh">Privacy</div><div class="list">${r('lock','#7B5BD6','App lock','Fingerprint or phone PIN',st.settings.lock,tog('lock'))}${r('bin','#D9534F','Recycle bin',st.bin.length+' items · deleted after 30 days','chev',"st.scr='bin';render()")}</div><div class="gh">Appearance</div><div class="list">${r('theme','#33443A','Theme',dark?'Dark':'Light','chev','toggleDark()')}</div><div class="gh">More</div><div class="list">${r('bug','#5B6B61','Diagnostics','Crash log and usage, on this phone only','chev',"st.scr='diag';render()")}${r('info','#1B8A5A','About Saveo','Version 1.0.0','chev',"st.scr='about';render()")}${r('lock','#17211B','Try the lock screen','Preview','chev',"st.scr='lock';render()")}</div></div>`,
bin:()=>`${back("st.scr='settings';render()")}Recycle bin</div></div>${st.bin.length?`<button class="btn txt" style="color:var(--err)" onclick="st.bin=[];snack('Bin emptied');render()">Empty</button>`:''}</div><div class="scroll"><div style="margin:4px 16px 14px;padding:12px 14px;border-radius:16px;background:var(--bg2);font-size:13px;color:var(--muted)">Items here are deleted forever after 30 days.</div>${st.bin.length?`<div class="grid">${st.bin.map(b=>{const s=st.statuses[b.id];return `<div><div class="tile" style="background:${s.bg}">${art(s.art)}${s.dur?`<div class="vb">▶ ${s.dur}</div>`:''}<button class="sv" style="width:auto;padding:0 12px;border-radius:999px;gap:4px;font:600 12px Roboto;color:#14804F" onclick="restoreBin(${b.id})">${I.restore}Restore</button></div><div style="font-size:12px;color:var(--muted);margin:6px 4px 0">${b.days} days left</div></div>`}).join('')}</div>`:`<div class="center" style="padding:70px 30px;color:var(--muted)"><div style="font-size:20px;font-weight:700;color:var(--ink)">Bin is empty</div><div style="margin-top:8px">Delete something from Saved to see it here.</div></div>`}</div>`,
lock:()=>`<div style="height:100%;background:linear-gradient(180deg,var(--bg2),var(--bg));width:100%" class="center"><div style="padding-top:150px"><div style="width:96px;height:96px;margin:0 auto;border-radius:26px;overflow:hidden;box-shadow:0 10px 28px rgba(27,138,90,.35)">${ICON}</div><div style="font-size:24px;font-weight:700;margin-top:24px">Saveo is locked</div><div style="font-size:15px;color:var(--muted);margin-top:8px">Use your fingerprint to open</div><button style="width:84px;height:84px;margin:80px auto 0;border-radius:50%;background:var(--mint);color:var(--pri);display:flex;align-items:center;justify-content:center;border:none;cursor:pointer" aria-label="Unlock" onclick="st.scr='home';render()">${I.fp}</button><div style="font-size:12px;color:var(--muted);margin-top:10px">Tap to unlock</div><button class="btn txt" style="margin:10px auto 0" onclick="st.scr='home';render()">Use PIN instead</button></div></div>`,
diag:()=>`${back("st.scr='settings';render()")}Diagnostics</div></div></div><div class="scroll"><div style="margin:4px 16px 0;font-size:13px;color:var(--muted)">Kept only on this phone. Nothing is sent anywhere.</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px">${[['Saved',st.savedOrder.length],['Shared','37'],['Reposted','12'],['App opens','419']].map(([a,b])=>`<div style="padding:16px;border-radius:20px;background:var(--card);box-shadow:var(--sh)"><div style="font-size:12px;color:var(--muted);font-weight:600">${a}</div><div style="font-size:28px;font-weight:700;margin-top:4px">${b}</div></div>`).join('')}</div><div class="gh">Crash log</div><div class="list"><div class="row"><span class="ri" style="background:var(--errbg);color:var(--err)">${I.bug}</span><div class="t"><b>18 Nov 2026, 10:42 PM</b><span>Video viewer · v1.0.0</span></div></div></div></div><div style="position:absolute;left:24px;right:24px;bottom:28px;display:flex;gap:10px"><button class="btn ton" style="flex:1" onclick="snack('Log cleared');render()">Clear</button><button class="btn" style="flex:2" onclick="snack('Share sheet opens with saveo-log.txt');render()">${I.share} Export log</button></div>`,
about:()=>`${back("st.scr='settings';render()")}About</div></div></div><div class="scroll"><div class="center" style="padding-top:30px"><div style="width:110px;height:110px;margin:0 auto;border-radius:28px;overflow:hidden;box-shadow:0 10px 28px rgba(27,138,90,.35)">${ICON}</div><div style="font-size:26px;font-weight:700;margin-top:18px">Saveo</div><div style="color:var(--muted);margin-top:4px">Version 1.0.0</div></div><div class="gh" style="margin-top:20px">Developer</div><div class="list"><div class="row"><span class="ri" style="background:var(--mint);color:var(--pri);font-weight:700">SK</span><div class="t"><b>Sushant Kumar</b><span>sushant.sare@gmail.com</span></div></div></div><div class="gh">Info</div><div class="list">${r('lock','#7B5BD6','Privacy','No internet, no ads. Your data stays on this phone.','chev')}${r('info','#5B6B61','Open-source licences','','chev')}</div></div>`
};
function restoreBin(id){st.bin=st.bin.filter(b=>b.id!=id);st.statuses[id].saved=true;st.savedOrder.unshift(id);snack('Restored to Saved');render()}
function sheetView(){
 const sh={source:['Show statuses from',[['WhatsApp',"st.source='WhatsApp'"],['WhatsApp Business',"st.source='Business'"],['All sources',"st.source='All'"]]],
 menu:['',[['Select',"st.sel=new Set()"],['Refresh',"snack('Up to date · 9 statuses')"],['Settings',"st.scr='settings'"]]],
 sort:['Sort saved items',[['Newest first','st.sortNew=true'],['Oldest first','st.sortNew=false']]],
 date:['Show saved from',[['Today',"snack('Showing today')"],['Last 7 days',"snack('Showing last 7 days')"],['Pick dates…',"snack('Date range picker opens')"]]]}[st.sheet];
 return `<div class="scrim" onclick="st.sheet=null;render()"></div><div class="sheet"><div class="handle"></div>${sh[0]?`<div style="padding:0 24px 8px;font-weight:700;font-size:17px">${sh[0]}</div>`:''}${sh[1].map(([l,f])=>`<div class="opt" onclick="${f};st.sheet=null;render()">${l}</div>`).join('')}</div>`}
function railView(){return `<div class="rail">${[['grid','Statuses',"st.scr='home';st.tab=0"],['bag','Saved',"st.scr='home';st.tab=1"],['gear','Settings',"st.scr='settings'"]].map(([k,l,f],i)=>{const a=(st.scr=='home'&&st.tab==i)||(i==2&&['settings','bin','diag','about'].includes(st.scr));return `<div class="center" style="font-size:12px;font-weight:600;color:${a?'var(--pri)':'var(--muted)'};cursor:pointer" onclick="${f};st.sel=null;render()"><div style="width:56px;height:32px;border-radius:16px;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;background:${a?'var(--mint)':'none'}">${I[k]}</div>${l}</div>`}).join('')}</div>`}
function render(){
 const app=document.getElementById('app'),W=wide();app.className=(W?'wide':'phone')+(dark?' dark':'');
 const nav=['onboard','folder','lock'].includes(st.scr);
 let main=st.scr=='home'?homeView():SCR[st.scr]();
 let side='';
 if(W&&st.scr=='home'&&!st.viewer){const id=list()[0]?.id;if(id!=null){st.viewer={id,list:list().map(s=>s.id),auto:1}}}
 if(W&&st.viewer)side=viewerView();
 let html=(nav?'':railView())+`<div class="pane">${main}${!W&&st.viewer?viewerView():''}${st.sheet?sheetView():''}${st.snack?`<div class="snack"><span>${st.snack.t}</span>${st.snack.a?`<b onclick="st.snack.fn()">${st.snack.a}</b>`:''}</div>`:''}</div>`+(nav?'':`<div class="side">${side}</div>`);
 app.innerHTML=html;
 if(W&&st.viewer&&st.viewer.auto){/*keep*/}
}
addEventListener('resize',()=>{if(!wide()&&st.viewer&&st.viewer.auto)st.viewer=null;render()});
restart();
</script></body></html>
